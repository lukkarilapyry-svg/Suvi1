      "Ehdollinen tuki on keskeinen riskitekijä – yhteys itsemääräämisteorian ehdolliseen arvostukseen (motivaatiokirja) [T: vertailu]."

/* ---------- Harter luku 4 (s. 131–157): kirjan tekstiä nähty vain avauskappale ---------- */
{
  id:"h4_nouseva_aikuisuus", category:"h_aikuistuminen", book:"harter",
  name:"Nouseva aikuisuus (18–25 v): Arnettin teoria ja minän prosessit",
  source:"Harter (2012) luku 4, s. 131–157; Arnett (2000)",
  badges:[{label:"Harter luku 4"},{label:"18–25 v", cls:"onset-aikuisuus"}],
  sourceStatus:"[V] Luvun 4 avauskappale (JSTOR) ja Arnettin (2000) alkuperäisartikkeli, johon luku perustuu. [EI LÖYTYNYT] Luvun sisältöä avauskappaleen jälkeen (alaotsikot, Harterin omat aineistot) ei ollut saatavilla – lue luku kirjasta.",
  tags:{kehitys:true, elamankulku:true, sosiokulttuurinen:true, harter:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Harter aloittaa luvun Arnettin käsitteellä emerging adulthood: se koskee noin 18–25-vuotiaita, jotka eivät enää (Harterin sanoin ”oletettavasti”) ole yhtä riippuvaisia vanhemmistaan kuin lapsuudessa ja nuoruudessa, mutta eivät ole vielä ottaneet aikuisuuden pysyvämpiä vastuita, kuten uraa, taloudellista itsenäisyyttä, avioliittoa ja vanhemmuutta (s. 131)."},
    {title:"Arnett (2000): miksi oma kehitysvaihe?", type:"list", items:[
      "[V] Ei nuoruutta eikä nuorta aikuisuutta; erottuu demografisesti, subjektiivisesti ja identiteetin etsinnän osalta; olemassa vain kulttuureissa, jotka sallivat pitkän itsenäisen roolikokeilun jakson.",
      "[V] Demografisesti ainoa elämänvaihe, jossa ”mikään ei ole normatiivista” – asuminen, opiskelu ja perhetilanne vaihtelevat suuresti.",
      "[V] Subjektiivisesti moni vastaa kysymykseen ”oletko aikuinen?” ”joiltain osin kyllä, joiltain ei”. Tärkeimmät aikuisuuden kriteerit ovat vastuun ottaminen itsestä, itsenäiset päätökset ja taloudellinen itsenäisyys – eivät demografiset siirtymät.",

  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Ne, joilla on kielteinen käsitys koulukyvyistään, raportoivat johdonmukaisesti matalampaa tai haitallisempaa motivaatiota, kuten suuntautumista ulkoisiin palkkioihin ja sanktioihin. Uteliaisuuden ja hallinnan ilon motivoimilla on myönteisempi käsitys kyvyistään (esipuhe s. xvii)."},
    {title:"Harterin (1981) mittari: sisäinen vs. ulkoinen orientaatio", type:"list", items:[

      "[V] Koettu koulupätevyys korreloi motivaatioon: haasteen suosiminen r = .57, uteliaisuus .33, itsenäinen hallinta .54; yhdistetty motivaatiomuuttuja alakoulussa .52 ja yläkoulussa .58 (Harter & Connell 1984) (s. 236)."
    ]},
    {title:"Kehitys kouluvuosina", type:"list", items:[
      "[V] Sisäinen motivaatio laskee jyrkästi luokilta 3–9: haasteen suosiminen, uteliaisuus ja itsenäinen hallinta vähenevät (s. 238).",
      "[V] Samalla tieto ”koulu-nimisen pelin säännöistä” (itsenäinen arviointi, sisäiset kriteerit) kasvaa; Harterin tulkinnan mukaan tämä liittyy siihen, että moni valitsee ulkoisen orientaation (s. 239).",
      "[V] Testiahdistus kasvaa alakoulusta yläkouluun ja pysyy sen jälkeen korkeana (s. 237).",
      "[V] Polkumalli: koulukäytännöt → koettu pätevyys → pätevyyteen liittyvä affekti (esim. huoli) → motivaatio-orientaatio (Harter, Whitesell & Kowalski 1992) (s. 236, 242)."

      "[V] Siirryttäessä yläkouluun luokkaympäristö muuttuu persoonattomammaksi: kyvyn korostus ponnistelun sijaan, julkinen arvosanojen esillepano, kilpailu ja sosiaalinen vertailu; arviointi siirtyy prosessista tuotoksiin (s. xvii, 239–240).",

{

  badges:[{label:"Harter luku 7"},{label:"Kouluikä"}],
  sourceStatus:"[V] Harterin kirjan omaa tekstiä nähty Google Booksin esikatselun hakukatkelmina. [EI LÖYTYNYT] Kowalskin (1985) kaikkien tunneryhmien pätevyyskeskiarvoja ei näkynyt.",
  tags:{oppiminen:true, kehitys:true, harter:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Harter lisää sisäisen ja ulkoisen rinnalle sisäistetyn motivaation: lapsi opiskelee inhokkiaineen kokeeseen tai siivoaa huoneensa, koska alun perin ulkoiset arvot on omaksuttu omiksi. Ryan ja Deci erottavat sisäisen motivaation (luontainen kiinnostus) ja sisäistetyn (arvostettu toiminta); molemmat koetaan vapaaehtoisina (s. 254–255)."},
    {title:"Tunteet luokassa", type:"list", items:[
      "[V] Onnistumisiin ja epäonnistumisiin liittyvät tunteet jaettiin itsetietoisiin (häpeä, vihaisuus itselle, syyllisyys; ylpeys) ja ulospäin suuntautuviin (turhautuminen, suru, huoli; ilo, helpotus) (s. 235, 260).",
      "[V] Itsetietoisia tunteita sekä onnistumisissa että epäonnistumisissa raportoivilla oli korkein koettu pätevyys (Kowalski 1985) (s. 260–261).",
      "[V] Heillä sisäistetty motivaatio oli vahvin lähde, sen jälkeen sisäinen; ulospäin suuntautuvia tunteita kokevilla molemmat olivat matalampia (s. 261–262).",
      "[V] Johtopäätös: tunteen valenssin lisäksi olennaista on, suuntautuuko tunne minään vai ulospäin."
    ]},
    {title:"Minäarvioiden tarkkuus", type:"list", items:[
      "[V] Oppilaat jaettiin yliarvioijiin, aliarvioijiin ja tarkkoihin (oma vs. opettajan arvio) (s. 262–264).",

      "[V] Yliarvioijat tarvitsevat Harterin mukaan tarkempia – aluksi matalampia – arvioita, aliarvioijat vahvistusta todellisille kyvyilleen; tavoitteena realistiset arviot."
    ]},
    {title:"Sukupuoli ja ”ääni”", type:"list", items:[
      "[V] Oman mielipiteen ilmaiseminen (voice) on toden minän käyttäytymistä, sen tukahduttaminen epätoden minän käyttäytymistä (s. 266–267).",
      "[V] Harterin aineistoissa ei löytynyt yleistä sukupuolieroa eikä tyttöjen äänen ”notkahdusta” keskinuoruudessa; tärkeämpiä olivat yksilöerot kummankin sukupuolen sisällä. Gilliganin kuvaus voi koskea erityisesti feminiinisesti orientoituneita tyttöjä (s. 266–267).",

    ]}

    {title:"Ydinajatus", type:"text", text:"[V] Luku erottaa kulttuurin arvojärjestelmän (individualismi–kollektivismi) ja sen mukaiset minäkonstruaalit (itsenäinen vs. toisista riippuvainen minä). Useimmat nykytutkijat myöntävät, että rajat on vedetty liian jyrkästi, ja Harter esittää kritiikin teoreettisesta, menetelmällisestä ja empiirisestä näkökulmasta (esipuhe s. xviii)."},
    {title:"Peruskäsitteet", type:"list", items:[
      "[V] Triandis (1989) määritteli perusarvot; Markus & Kitayama (1991) osoittivat, että kulttuurit tuottavat erilaisia minäkonstruaaleja (s. 281–282).",
      "[V] Individualismi: ainutlaatuisuus, erillisyys, henkilökohtaiset tavoitteet, valinnanvapaus. Kollektivismi: velvollisuus sisäryhmää kohtaan, harmonia, sopeutuminen; menestys selitetään muiden avulla ja ponnistelulla (taulukko 8.1, s. 282–285).",
      "[V] Agenssin mallit: erillinen (disjoint) agenssi itsenäisellä minällä, yhteinen (conjoint) agenssi suhteessa muihin – toisista riippuvaisellakin minällä on agenssia (Markus & Kitayama 2003) (s. 306–307)."
    ]},
    {title:"Vankat erot", type:"list", items:[

      "[V] Itäaasialainen ristiriitojen sieto (naiivi dialektiikka): korealaiset kokivat itsensä joustavammiksi kontekstien välillä, ja tämä ennusti hyvinvointia – vastoin länsimaista oletusta, että johdonmukainen identiteetti on hyvinvoinnin ehto (Suh 2002) (s. 294–295).",
      "[V] Harterin ennuste: länsimaisilla nuorilla vastakkaiset piirteet eri suhteissa aiheuttavat konfliktia ja voivat tuntua epätodelta minältä; itäisessä ajattelussa ne voisivat kaikki olla toden minän ilmentymiä (s. 296–297)."
    ]},
    {title:"Kasvatus ja itsetunto", type:"list", items:[
      "[V] Eurooppalais-amerikkalaiset äidit korostivat itsetuntoa ja sosiaalisia taitoja, kiinalais-amerikkalaiset kovaa työtä (Chao 1996); amerikkalaiset äidit puhuivat paljon lapsen itsetunnon rakentamisesta, taiwanilaiset harvoin (s. 303–305).",

    {title:"Mittaamisen ongelmat", type:"list", items:[

    {title:"Silta lukuun 9", type:"text", text:"[V] Harter korostaa, että amerikkalaiset arvot voivat tuottaa epärealistisia itsen kohottamisen strategioita ja itseä suosivia vinoumia, jotka estävät aidon yhteyden muihin ja lopulta kääntyvät itseä vastaan (s. xviii)."}

{
  id:"h9_narsismi_itsetunto", category:"h_aitous", book:"harter",

  badges:[{label:"Harter luku 9"},{label:"Itsetunto"}],
  sourceStatus:"[V] Harterin kirjan omaa tekstiä nähty Google Booksin esikatselun hakukatkelmina. [EI LÖYTYNYT] Kirjan tekstissä oleva viite ”Baumeister, Campbell, Krueger & Vohs 2005” – lähdeluettelossa on vuoden 2003 katsaus; tarkkaa 2005-julkaisua ei varmistettu.",

  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Itsetunnon tasoon on kiinnitetty liikaa huomiota ja sen laatuun liian vähän. Harterin mukaan optimaalista itsetuntoa kuvaa parhaiten se, ettei ihminen jatkuvasti mieti omaa arvoaan (s. 346). Narsismi ja itsetunto on erotettava toisistaan (Harter & McCarley 2004) (s. 342–344)."},
    {title:"Narsismi", type:"list", items:[
      "[V] Varhainen, normatiivinen narsismi (terveet illuusiot) vs. myöhäislapsuudessa näkyvät patologiset muodot (muiden väheksyminen, raivo kritiikistä); varhaisnuoruudessa narsistisen persoonallisuushäiriön piirteet alkavat kiteytyä (s. 339–340).",
      "[V] Narsismi on sosiaalinen ansa: lyhyellä aikavälillä vähemmän ahdistusta, pitkällä aikavälillä vahingoittuvat suhteet (Campbell & Buffardi 2008). Baumeister & Vohs (2001) kutsuvat sitä ”itsetuntoaddiktioksi” (s. 341).",

      "[V] Harter & McCarley (2004): narsismin ja itsetunnon korrelaatio nuorilla oli noin .03, joten ne muodostavat neljä erillistä yhdistelmää (s. 342–344).",
      "[V] Thomaes ym. (2008): narsismi yhdessä korkean itsetunnon kanssa ennusti poikkeuksellisen voimakasta aggressiota uhan edessä – mutta vain, jos lapsi oli nolattu (s. 343–345)."

    {title:"Optimaalinen/tosi vs. ehdollinen itsetunto", type:"list", items:[

      "[V] Ehdollinen itsetunto on ”korkean ylläpidon” itsetuntoa ja liittyy masennukseen ja vihamielisyyteen (Kernis & Goldman) (s. 347–348).",
      "[V] Tosi itsetunto on SDT:n mukaan ehdoton ja suhteellisen vakaa: se ei paisu onnistuessa eikä romahda epäonnistuessa (Ryan & Brown 2006) (s. 347–348).",
      "[V] Harterin oma ”peiliminäorientaatio”: nuoret, joiden hyväksyntä määrää itsearvon, olivat enemmän huolissaan hyväksynnästä, heidän itsetuntonsa vaihteli enemmän, ja hyväksynnän tavoittelu häiritsi keskittymistä koulutyöhön (s. 350)."

    {title:"Itsetuntoliike", type:"list", items:[

      "[V] Baumeisterin kritiikki korkean itsetunnon tavoittelusta vs. Harterin ja Swannin vastakritiikki: Baumeister rinnastaa narsistien puolustuksellisuuden aidon ja turvallisen korkean itsetunnon kanssa (s. 356–358).",
      "[V] Pelkät itsensä vahvistamisen harjoitukset ovat lyhytkestoisia; ohjelmien tulisi muuttaa kestävän itsetunnon ”raaka-aineita” ja tuottaa realistisia minäkäsityksiä (Swann ym. 2007) (s. 360)."
    ]}

{
  id:"m0_historia", category:"m_perusta", book:"mml",

  source:"Nurmi & Salmela-Aro: Johdanto (2017), s. 11–13",
  badges:[{label:"MML johdanto"},{label:"Historia"}],
  sourceStatus:"[V] Tarkistettu kirjan johdantoluvusta (kustantajan julkaisema ote).",
  tags:{teoria:true, historia:true, elamankulku:true, mml:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"Psykologian varhaiset motivaatiokäsitykset olivat pääosin implisiittisiä: niitä ei esitetty suoraan vaan pääteltiin teorioiden yleisistä väittämistä (s. 11)."},
    {title:"Aikajana (s. 11–13)", type:"list", items:[
      "Psykoanalyysi (Freud): motivoivat voimat kumpuavat idin tiedostamattomista seksuaalisista impulsseista, joita ego ja superego suitsivat; kehitysvaiheet määräytyvät sen mukaan, missä osassa elimistöä mielihyvä koetaan. Kirjoittajat huomauttavat yhtäläisyydestä itsesäätely- ja impulssikontrolliteorioihin.",
      "Behaviorismi ja oppimisteoria: yksilö tekee sitä, mistä on palkittu, ja välttää sitä, mistä on rangaistu (välineellinen oppiminen); ehdollistumisessa neutraali asia liitetään palkitsevaan tai epämiellyttävään asiaan.",
      "Humanistinen psykologia: Maslow'n tarvehierarkia (fysiologiset, turvallisuus, yhteenkuuluvuus, itsensä kunnioittaminen, itsensä toteuttaminen) laajensi homeostaattista tarvekäsitystä. Positiivisen psykologian liike syntyi paljolti humanististen ajatusten pohjalta.",
      "Yhteistä näille: motivaatio nähdään sisäisinä pyrkimyksinä, joita ulkoiset tekijät lähinnä rajoittavat; valtaosa teorioista kehittyi Yhdysvalloissa.",
      "1950-luvun lopulta eurooppalaiset hierarkkiset teoriat: Nuttinin relationaalinen motivaatioteoria (motivaatio henkilön ja ulkomaailman suhteena, yksilölliset motiivihierarkiat) ja Leontjevin toiminnan teoria (toiminta–toiminnot–operaatiot). Kumpaakaan ei juuri tutkittu empiirisesti; molemmissa yhtäläisyyksiä itsesäätelyteoriaan.",
      "1990-luvulla Yhdysvalloissa tavoitekäsitteiset lähestymistavat: Klingerin huolenaiheet, Littlen henkilökohtaiset projektit, Emmonsin henkilökohtaiset pyrkimykset. Mittaus: henkilö listaa tärkeät projektinsa ja arvioi niitä ulottuvuuksilla (tärkeys, hallinnan tunne, stressi, myönteiset tunteet); menetelmät ovat yhä käytössä.",
      "1990-luvulta elämänkulkua korostavat teoriat: Nurmen ja Salmela-Aron teorian pohjana Havighurstin, Baltesin ja Elderin elämänkulku- ja elämänkaariteoriat (ikäsidonnaiset kehitystehtävät, roolisiirtymät, toimintamahdollisuudet). Samankaltaisia teorioita kehittivät Brandtstädter ja Heckhausen."
    ]},
    {title:"Keskeinen tutkimustulos johdannossa", type:"text", text:"Johdannon mukaan eri-ikäisten tavoitteet kohdistuvat pääosin oman elämänvaiheen kehitystehtäviin ja roolisiirtymiin, ja psyykkinen hyvinvointi on parempi, kun tavoitteet koskevat juuri näitä ikäsidonnaisia tehtäviä (s. 13)."},
    {title:"Helposti sekoitettavat", type:"list", items:[

    {title:"Ydinajatus", type:"text", text:"[V-2nd] Käyttäytymisgenetiikalla voidaan tutkia, missä määrin motivationaalinen suuntautuminen riippuu geeneistä, jaetusta ympäristöstä ja yksilölle ainutlaatuisesta ympäristöstä. Kukkamäen (2018) mukaan Read toteaa perimän vaikuttavan tavoitteisiin samassa määrin kuin moniin samankaltaisiin psykologisiin ominaisuuksiin (esim. temperamentti), ja tutkimusta on vielä hyvin vähän."},

      "[V] Terveys-, työ-, harrastus- ja elämänfilosofiatavoitteet selittyivät pääosin yksilöllisellä ympäristöllä; vanhempiin ja sukulaisiin liittyvissä tavoitteissa näkyi myös jaettu ympäristö.",

{
  id:"m1_tavoitteet_elamankulku", category:"m_tavoitteet", book:"mml",

  sourceStatus:"[V] Johdannon kuvaus teoriasta ja luvun asiasanat (kehitystehtävä, SOC-malli, 4S-motivaatiomalli). [V-2nd] 4S-mallin nimet ja keskeiset väitteet kahdesta kirja-arviosta. [V] Tutkimustulokset kirjoittajien ohjaamista väitöskirjoista (Marttinen 2017; Vasalampi 2012). [EI LÖYTYNYT] Luvun omaa tekstiä ei saatavilla; 4. ässän sanamuoto vaihtelee arvioissa (sopeuttaminen / sopeutuminen).",
  tags:{elamankulku:true, hyvinvointi:true, teoria:true, mml:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Johdannon mukaan teoria pohjautuu Havighurstin, Baltesin ja Elderin elämänkulku- ja elämänkaariteorioihin: jokaiselle elämänvaiheelle ovat tyypillisiä ikäsidonnaiset kehitystehtävät, roolisiirtymät ja toimintamahdollisuudet. Eri-ikäisten tavoitteet kohdistuvat pääosin oman elämänvaiheen kehitystehtäviin, ja hyvinvointi on parempi, kun tavoitteet koskevat juuri niitä (s. 13–14)."},
    {title:"Ikävaiheiden tyypilliset tavoitteet (johdanto)", type:"list", items:[
      "[V] Nuori: koulutus, kaverisuhteet ja työuran löytäminen.",
      "[V] Aikuinen: työura, perhe ja lapset.",
      "[V] Vanheneva: eläkkeelle siirtyminen ja terveys.",
      "[V] Samansuuntaisia teorioita ovat kehittäneet Brandtstädter ja Heckhausen."
    ]},
    {title:"4S-motivaatiomalli", type:"list", items:[
      "[V-2nd] Neljä ässää: suuntaaminen, suunnistaminen, sosiaalinen säätely ja sopeuttaminen (Kukkamäki; Juvonen käyttää muotoa sopeutuminen).",
      "[V-2nd] Sosiaalisessa ympäristössä tapahtuva yhteissäätely saa ihmiset sopeuttamaan, muokkaamaan ja kompensoimaan tavoitteitaan elämänvaiheen vaatimusten ja ympäristön palautteen mukaan.",
      "[V-2nd] Kun vaihtoehtoja on paljon (usein nuoruudessa), motivaation perusmekanismina korostuu valinta; kun vaihtoehdot vanhetessa supistuvat, korostuu sopeutuminen.",
      "[V] Englanninkielinen vastine on Salmela-Aron (2009) ”four C's” – channelling, choice, co-agency, compensation: ikäsidonnaiset ympäristöt kanavoivat, yksilö valitsee ja sitoutuu, tärkeät muut säätelevät yhdessä, ja tavoitteita muokataan palautteen perusteella (Marttinen 2017).",
      "[T] Suomenkielisten ja englanninkielisten nimien vastaavuus (kanavointi ≈ suuntaaminen jne.) on päätelty, ei varmistettu luvusta."
    ]},
    {title:"Tavoitteiden sisältö ja hyvinvointi", type:"list", items:[
      "[V-2nd] Konkreettiset tavoitteet ovat helpommin arvioitavia ja saavutettavia kuin abstraktit; niistä saa selkeää palautetta, mikä lisää hyvinvointia.",
      "[V-2nd] Itsen ulkopuolelle asetetut tavoitteet tukevat hyvinvointia; pelkkiin itseen liittyviin tavoitteisiin suuntautuminen johtaa herkästi vatvomiseen ja jopa masentumiseen.",
      "[V] Itseen kohdistuvien tavoitteiden ja masennusoireiden yhteys on vastavuoroinen (Salmela-Aro & Nurmi 1997, Marttisen 2017 kuvaamana).",
      "[V-abs] Nuorilla aikuisilla kaksosilla (21–26 v) perheeseen, elämänfilosofiaan tai koulutukseen liittyvä tavoite heikensi itseen kohdistuvien tavoitteiden ja masennusoireiden yhteyttä (Salmela-Aro, Read ym. 2012)."
    ]},
    {title:"Siirtymät", type:"list", items:[
      "[V-2nd] Merkittävät elämänsiirtymät, kuten vanhemmaksi tuleminen tai eläköityminen, suuntaavat motivaatiota; tavoitteet muuttuvat siirtymän haasteiden mukaan (Juvonen).",
      "[V] Koulutussiirtymä on kaksisuuntainen: nuori ohjaa elämäänsä tavoitteilla, mutta koulutusrakenteet kanavoivat ja rajoittavat suunnitelmia (Vasalampi & Salmela-Aro 2014).",
      "[V] Siirtymässä muokataan erityisesti juuri ohitettuun siirtymään liittyviä tavoitteita; muiden alueiden tavoitteet pysyvät vakaampina (Nurmi & Salmela-Aro 2002, Vasalammen 2012 kuvaamana).",
      "[V] FinEdu (17-vuotiaat, n = 1 144): useimpien tavoitteet koskivat normatiivisia kehitystehtäviä; pienellä ryhmällä oli paljon itseen liittyviä murehtivia tavoitteita, ja ne olivat yhteydessä opiskelu-uupumukseen ja masennusoireisiin (Marttinen 2017)."

  sourceStatus:"[V] Johdannon kuvaus menetelmästä. [V] Menetelmän yksityiskohdat kirjoittajien ryhmän julkaisuista (Salmela-Aro, Read ym. 2012; Vasalampi & Salmela-Aro 2014; Marttinen 2017). [EI LÖYTYNYT] Luvussa esitellyn lomakkeen tarkkoja kysymyksiä ja asteikkoja ei saatavilla.",
  tags:{mittaaminen:true, teoria:true, mml:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Johdannon mukaan ihmiset ovat yleensä tietoisia motivaation mitä-puolesta (tavoitteet, pyrkimykset, huolenaiheet) ja pystyvät kertomaan siitä – siksi tavoitteita voidaan tutkia itsearvioinnein. Miksi-puoli (arvot, perustarpeet) on harvoin tietoinen (s. 10)."},
    {title:"Tavoitteen kaltaiset käsitteet", type:"list", items:[
      "[V] Klinger: huolenaiheet (current concerns) – piilevämpiä, voivat olla kielteisiä huolia.",
      "[V] Little: henkilökohtaiset projektit – eksplisiittisesti muotoiltuja, tietoisesti ohjattuja toimintakokonaisuuksia, joilla on alku ja loppu ja jotka toteutuvat aina jossakin kontekstissa.",
      "[V] Emmons: henkilökohtaiset pyrkimykset.",
      "[V] Henkilökohtaiset tavoitteet = tulevaisuuteen suuntautuneet mielikuvat siitä, mitä ihmiset tavoittelevat eri elämänalueilla (Austin & Vancouver 1996, Vasalampi & Salmela-Aro 2014 mukaan)."
    ]},
    {title:"Menetelmän vaiheet", type:"list", items:[
      "[V] Henkilö listaa ensin tärkeät projektinsa/tavoitteensa ja arvioi sitten kutakin eri ulottuvuuksilla, kuten tärkeys, kontrollin tunne, stressi ja myönteiset tunteet (johdanto).",
      "[V] Sisällönanalyysi: vastaukset luokitellaan sisältöluokkiin (esim. koulutus, työ, oma perhe, ystävät, terveys, itse). FinnTwin12-tutkimuksessa kaksi arvioijaa luokitteli neljä projektia 16 luokkaan, yhtäpitävyys kappa 0,89.",
      "[V] Tavoitearvioinnit: Littlen alkuperäisessä menetelmässä 17 ulottuvuutta; myöhemmät versiot keskittyvät tärkeyteen, ponnisteluun, edistymiseen ja stressiin (Salmela-Aro 2001, Marttisen mukaan).",
      "[V] Arviointeja on yhdistetty muihin teorioihin: itsemääräämisteoriasta sisäinen ja ulkoinen motivaatio, odotusarvoteoriasta onnistumisodotus.",
      "[V] Self-concordance-indeksi: sisäisen motivaation pistemäärästä vähennetään ulkoisen motivaation pistemäärä (Sheldon & Elliot 1999; Vasalampi & Salmela-Aro 2014)."
    ]},
    {title:"Kehityssuuntia", type:"list", items:[
      "[V] Aiemmin arvioinnit summattiin kaikkien tavoitteiden yli; myöhemmin on arvioitu tietyn elämänalueen tavoitteita (esim. koulutustavoite), koska motivationaaliset yksiköt ovat kontekstisidonnaisia (Vasalampi 2012).",
      "[V] Henkilösuuntautuneet analyysit: tavoitesisällöistä muodostetaan ryhmiä klusterianalyysilla tai latenttien profiilien analyysilla (Marttinen 2017).",
      "[T] Menetelmä yhdistää idiografisen (henkilön omat sanat) ja nomoteettisen (vakioidut arviointiulottuvuudet) otteen."
    ]},
    {title:"Muista tentissä", type:"list", items:[

      "Osaa nimetä sekä sisällönanalyysin että tavoitearviointien idean ja keskeiset arviointiulottuvuudet."
    ]}

{
  id:"m1_sdt", category:"m_oppiminen", book:"mml",
  name:"Itsemääräämisteoria (Vasalampi)",
  source:"Vasalampi, K., s. 54–65; Ryan & Deci (2000, 2020, 2022)",
  badges:[{label:"MML Osa I"},{label:"SDT"}],
  sourceStatus:"[V] Johdannon kuvaus teoriasta (perustarpeet, sovellusalueet). [V] Teorian sisältö alkuperäislähteistä (Ryan & Deci 2000, 2020, 2022) ja Vasalammen omista julkaisuista. [EI LÖYTYNYT] Luvun omaa tekstiä ei saatavilla; johdannon mainitsemaa ”vaikuttamista neljäntenä perustarpeena” ei voitu varmistaa.",
  tags:{teoria:true, oppiminen:true, hyvinvointi:true, mml:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Johdannon mukaan itsemääräämisteoria (Deci & Ryan) lienee tällä hetkellä suosituin motivaatioteoria. Keskeinen viesti: ihmiset motivoituvat siitä, että he voivat itse päättää tekemisistään, ja omasta ajattelusta kumpuavat sisäiset vaikuttimet motivoivat enemmän kuin ulkoa tulevat. Perustarpeet ovat autonomia, kompetenssi ja yhteenkuuluvuus (s. 14)."},
    {title:"Motivaatiojatkumo (organismisen integraation teoria)", type:"list", items:[
      "[V] Amotivaatio: tarkoituksellisuuden puute (ei koettua kompetenssia tai toimintaa ei arvosteta).",
      "[V] Ulkoinen säätely: toimitaan palkkion tai rangaistuksen vuoksi – vähiten autonominen.",
      "[V] Introjektoitu säätely: osittain sisäistetty; toimitaan syyllisyyden välttämiseksi tai arvostuksen saamiseksi – sisäistä mutta painostavaa.",
      "[V] Tunnistettu säätely: toiminnan arvo on tunnistettu ja hyväksytty henkilökohtaisesti tärkeäksi.",
      "[V] Integroitu säätely: autonomisin ulkoisen motivaation muoto, yhteensopiva muiden arvojen kanssa.",
      "[V] Sisäinen motivaatio: toiminta itsessään on kiinnostavaa tai nautinnollista. Täysin integroitunutkaan ulkoinen motivaatio ei muutu sisäiseksi: integroitu perustuu arvoon, sisäinen kiinnostukseen (Ryan & Deci 2022)."
    ]},
    {title:"Autonominen vs. kontrolloitu motivaatio", type:"list", items:[
      "[V] Autonominen = sisäinen tai tunnistettu motivaatio; kontrolloitu = ulkoinen tai introjektoitu (Vasalampi 2012).",
      "[V] Kontrolloiduista tavoitteista luovutaan helpommin; tunnistettu motivaatio ylläpitää ponnistelua silloinkin, kun tavoite ei ole hauska – tärkeää esim. koulutustavoitteissa.",
      "[V] Useimmat teot ovat monen motiivin ohjaamia, siksi tutkimuksessa lasketaan suhteellisen autonomian indeksejä tai käytetään profiileja (Ryan & Deci 2022)."
    ]},
    {title:"Kuusi miniteoriaa (Ryan & Deci)", type:"list", items:[
      "[V] Kognitiivisen arvioinnin teoria: ulkoiset palkkiot, määräajat, arvioinnit ja tiukka valvonta yleensä heikentävät sisäistä motivaatiota; valinnan tarjoaminen ja myönteinen palaute vahvistavat sitä.",
      "[V] Organismisen integraation teoria: ulkoisen motivaation sisäistäminen (jatkumo yllä).",

    {title:"Sisäistäminen ja ympäristön tuki", type:"list", items:[

{
  id:"m1_odotusarvo", category:"m_oppiminen", book:"mml",
  name:"Odotusarvoteoria: odotukset ja arvostukset oppimisessa (Viljaranta)",
  source:"Viljaranta, J., s. 66–79; Eccles ym.",
  badges:[{label:"MML Osa I"},{label:"Eccles"}],
  sourceStatus:"[V] Johdannon kuvaus teoriasta. [V-2nd] Luvun sisältöä Kukkamäen (2018) arviosta. [V] Arvostuksen osatekijät ja suomalaiset tulokset Viljarannan omista julkaisuista (väitöskirja 2010 ja artikkelit). [EI LÖYTYNYT] Luvun omaa tekstiä ei saatavilla.",
  tags:{teoria:true, oppiminen:true, kehitys:true, mml:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Johdannon mukaan Ecclesin odotusarvoteoriaa käytetään eritoten oppimisen kuvaamisessa: onnistumiseen liittyvät odotukset ja arvostetut asiat luovat pohjan oppimiselle. Jos henkilö uskoo pärjäävänsä ja arvostaa onnistumista, hän panostaa tehtävään ja menestyy. Odotukset liittyvät olennaisesti minäkäsitykseen (s. 14)."},
    {title:"Kaksi pääkomponenttia", type:"list", items:[
      "[V] Onnistumisodotukset: käsitys siitä, miten hyvin pärjää tehtävässä; läheinen akateemiselle minäkäsitykselle, mutta tehtävä- ja aikasidonnaisempi (Raufelder, Viljaranta ym. 2024).",
      "[V] Arvostukset (task values): johdanto nimeää kolme – kiinnostus, henkilökohtainen tärkeys ja välineellinen arvo.",
      "[V] Viljarannan tutkimuksissa ja Nurmen (2013) kuvauksessa neljäs osa on kustannus: tehtävän kielteiset seuraukset, kuten ahdistus, vaadittu ponnistus ja menetetyt mahdollisuudet."
    ]},
    {title:"Arvostuksen osatekijät", type:"list", items:[
      "[V] Kiinnostusarvo (sisäinen arvo): tehtävästä saatava nautinto ja kiinnostus.",
      "[V] Tärkeysarvo (attainment value): onnistumisen merkitys identiteetille tai minäskeemalle.",
      "[V] Hyöty- eli välinearvo (utility value): tehtävän hyödyllisyys muiden tavoitteiden kannalta.",
      "[V] Kustannus (cost): tehtävän kielteiset puolet."
    ]},
    {title:"Kehitys ja sosiaalistajat", type:"list", items:[
      "[V-2nd] Kukkamäen mukaan odotukset ja arvot muuttuvat suhteellisen pysyviksi jo varsin varhain koulutaipaleella, ja motivaatio vaihtelee paljon saman luokan sisällä.",
      "[V] Nuorimmilla lapsilla arvostuksen ulottuvuudet eivät vielä erotu toisistaan; arvostukset ovat korkeita koulun alussa ja laskevat alakoulun aikana (Viljaranta 2010).",
      "[V] Vanhempien uskomukset vaikuttavat käyttäytymiseen (mallina toimiminen, odotusten viestiminen, kokemusten tarjoaminen), ja se vaikuttaa lapsen uskomuksiin ja arvostuksiin (Lazarides, Viljaranta ym. 2015).",
      "[V-abs] Ensimmäisellä luokalla opettajien uskomukset ennustivat lapsen myöhempää minäkäsitystä (hyvin suoriutuvilla), vanhempien eivät (Pesu, Viljaranta & Aunola 2016).",
      "[V-2nd] Kukkamäen mukaan opettajien ja vanhempien arviot ohjaavat odotusten kehitystä, joskus jopa todellista taitotasoa enemmän."
    ]},
    {title:"Tarkenna tentissä", type:"list", items:[
      "[V] Viljarannan omassa 1.–7. luokan seurannassa suoriutuminen ennusti myöhempää minäkäsitystä, mutta minäkäsitys tai kiinnostus ei ennustanut myöhempää suoriutumista (Viljaranta ym. 2014, tiivistelmä; väitöskirja 2010).",
      "Siis: aikuisten uskomukset vaikuttavat lapsen minäkäsitykseen, mutta väite ”motivaatio ennustaa taitoa” ei saanut tukea peruskouluikäisillä tässä aineistossa."
    ]},
    {title:"Suomalaisia tuloksia", type:"list", items:[
      "[V] Esiopetusvuonna matematiikkamotivaatio ja -taidot olivat vastavuoroisessa yhteydessä; peruskoulussa taito ennusti motivaatiota mutta ei päinvastoin (Viljaranta 2010).",
      "[V] Toisen asteen siirtymässä (FinEdu, n = 614) arvostusprofiilit – esim. kaikkia aineita arvostavat, vähän arvostavat, matematiikkaa ja luonnontieteitä arvostavat – ennustivat koulutusväylää ja ammattitoiveita.",
      "[V] Keskiarvojen lasku iän myötä voi johtua siitä, että nuori alkaa arvostaa vain yhtä tai muutamaa ainetta (henkilösuuntautunut tulkinta)."
    ]},
    {title:"Suhde muihin teorioihin", type:"list", items:[
      "[V-2nd] Kirjan loppupohdinnan mukaan minäkuvan yhteys motivaatioon näkyy sekä odotusarvoteoriassa (odotukset) että itsemääräämisteoriassa (kompetenssi); motivaation kohteellisuus näkyy sekä odotusarvo- että tavoiteteoriassa.",
      "[V] Nurmen (2013) mukaan odotusarvoteoria korostaa aiemmasta oppimisesta saatavan palautteen ja minäkuvan merkitystä motivaation kehittymisessä.",
      "[T] Yhteys Harteriin: koettu pätevyys ja itsearvio rakentuvat osin muiden arvioista – vrt. Cooleyn peiliminä."
    ]}
  ],

{
  id:"m1_tavoiteorientaatiot", category:"m_oppiminen", book:"mml",
  name:"Tavoiteorientaatiot, oppiminen ja hyvinvointi (Tuominen, Pulkka, Tapola & Niemivirta)",
  source:"Tuominen, Pulkka, Tapola & Niemivirta, s. 80–98; Niemivirta ym. (2019)",
  badges:[{label:"MML Osa I"},{label:"Henkilösuuntautunut"}],
  sourceStatus:"[V] Johdannon kuvaus teoriasta. [V] Sisältö samojen neljän kirjoittajan englanninkielisestä katsausluvusta (Niemivirta ym. 2019) ja suomenkielisestä artikkelista (Tuominen-Soini ym. 2010). [EI LÖYTYNYT] Suomenkielisen luvun omaa tekstiä ei saatavilla.",
  tags:{teoria:true, oppiminen:true, hyvinvointi:true, mittaaminen:true, mml:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Johdannon mukaan tavoiteorientaatioteorian kehittelijöitä ovat Nicholls, Dweck ja Pintrich. Yksilöt eroavat siinä, motivoiko heitä tehtäväsuuntautuneisuus (kiinnostus itse tehtävään) vai minäsuuntautuneisuus (halu osoittaa olevansa muita parempi); lisäksi on epäonnistumisen pelkoon perustuva välttämissuuntautuneisuus (s. 14–15)."},
    {title:"Teorian historia", type:"list", items:[
      "[V] Nicholls: onnistuminen määritellään joko suhteessa omaan aiempaan (tehtäväsuuntautuneisuus) tai normatiivisesti muihin verraten (minäsuuntautuneisuus).",
      "[V] Dweck: oppimis- ja suoritustavoitteet; oppimistavoitteita tavoittelevat näkevät virheet osana oppimista, suoritustavoitteita tavoittelevat merkkinä kyvyttömyydestä (Dweck & Leggett 1988).",
      "[V] Suoritustavoitteet jaettiin lähestymis- ja välttämismuotoon; myöhemmin 2 × 2- ja 3 × 2 -mallit.",
      "[V] Tavoiteorientaatiot ovat yksilöllisiä taipumuksia suosia tietynlaisia tavoitteita; ne aktivoituvat tilanteen mukaan eivätkä ole jatkuvasti tietoisia."
    ]},
    {title:"Viisi orientaatiota (Niemivirran mittari)", type:"list", items:[
      "[V] Oppimisorientaatio: ”Minulle tärkeä tavoite koulussa on oppia mahdollisimman paljon.”",
      "[V] Menestysorientaatio: hyvät arvosanat ja absoluuttinen menestys.",
      "[V] Suoritus-lähestymisorientaatio: pyrkimys näyttää kyvykkäältä ja menestyä muita paremmin.",
      "[V] Suoritus-välttämisorientaatio: halu välttää epäonnistumista muiden edessä.",
      "[V] Välttämisorientaatio: selvitä mahdollisimman vähällä työllä.",
      "[V] Orientaatiot heijastavat kolmea funktiota: itsensä kehittäminen, itsensä korostaminen ja itsensä suojaaminen (Niemivirta ym. 2019)."
    ]},
    {title:"Henkilösuuntautunut lähestymistapa ja profiilit", type:"list", items:[
      "[V] Muuttujasuuntautuneessa tutkimuksessa analysoidaan muuttujien suhteita, henkilösuuntautuneessa yksilöiden ryhmiä eli profiileja; lähestymistavat täydentävät toisiaan.",
      "[V] Tyypilliset profiilit: oppimisorientoituneet, menestysorientoituneet, suoritusorientoituneet, välttämisorientoituneet ja sitoutumattomat.",
      "[V] FinEdu: sekä 9.-luokkalaisilla että lukiolaisilla löytyi neljä ryhmää; profiili säilyi 9. luokalla 57 %:lla ja lukiossa 60 %:lla, ja muutokset suuntautuivat lähinnä naapuriryhmiin (Tuominen-Soini ym. 2010).",
      "[V] Sukupuolierot olivat johdonmukaisia mutta pieniä: pojat korostivat enemmän suhteellista menestymistä ja välttämistä."
    ]},
    {title:"Profiilit, oppiminen ja hyvinvointi", type:"list", items:[
      "[V] Oppimis- ja menestysorientoituneet ovat sitoutuneita ja käyttävät tehokkaita strategioita; välttämisorientoituneilla on haitallisimmat mallit ja heikoin menestys.",
      "[V] Menestysorientoituneet menestyvät hyvin, mutta suoritushuoli tekee heistä alttiimpia koulu-uupumukselle ja stressille – ”menestyksellä voi olla hintansa”.",
      "[V] Sitoutumattomilla sitoutuminen on matalaa, mutta erityisiä hyvinvointiongelmia ei ole; välttämisorientoituneilla kyynisyyttä, riittämättömyyttä ja masennusoireita.",
      "[V] Motivaatio toimii linssinä, jonka läpi oppimisympäristö tulkitaan."
    ]},
    {title:"Käytännön johtopäätöksiä", type:"list", items:[
      "[V] Oppilaita ei pidä leimata profiilien perusteella, koska profiilit eivät ole pysyviä.",
      "[V] Epäonnistumisen salliva ja tukeva ympäristö hyödyttää kaikkia; liian vertaileva ilmapiiri voi väsyttää hyvin menestyviäkin.",
      "[V] Johdannon mukaan teemaa käsitellään myös Liukkosen ja Jaakkolan urheilumotivaatioluvussa (Osa III)."
    ]}

    {title:"Ydinajatus", type:"text", text:"[V] Työn imu on tarmokkuutta, omistautumista ja työhön uppoutumista – myönteinen, suhteellisen pysyvä tunne- ja motivaatiotila (Hakanen 2011). [V-2nd] Juvosen mukaan kirja korostaa työn imun hyviä seurauksia sekä yksilölle että työnantajalle, ja siihen liitetään mm. oikeudenmukaisuuden kokemus ja kannustava lähiesihenkilö."},
    {title:"Kolme ulottuvuutta", type:"list", items:[
      "[V] Tarmokkuus: energisyys, halu panostaa työhön ja sinnikkyys myös vastoinkäymisissä.",
      "[V] Omistautuminen: merkityksellisyyden, innokkuuden, inspiraation, ylpeyden ja haasteellisuuden kokemukset.",
      "[V] Uppoutuminen: syvä keskittyminen ja nautinto; aika kuluu huomaamatta.",
      "[V] Tarmokkuus ja omistautuminen ovat uupumusasteisen väsymyksen ja kyynisyyden vastakohtia (Schaufeli & Bakker 2004)."
    ]},
    {title:"Rajaukset: mitä työn imu ei ole", type:"list", items:[
      "[V] Ei flow: flow on hetkellinen, tilanteeseen sidottu huippukokemus, työn imu pysyvämpi tila.",
      "[V] Ei työuupumuksen pelkkä vastakohta: suomalaisissa aineistoissa korrelaatiot −0,52…−0,59, eli ilmiöt eivät ole saman asian kääntöpuolia.",
      "[V] Ei työholismi: työholismi on kohtuutonta työntekoa ja pakkomielteistä ajattelua, josta on vaikea irtautua. Tutkimus ei tue väitettä, että työn imu johtaisi työholismiin; vain uppoutuminen korreloi lievästi työholismin kanssa (UWES-käsikirja)."
    ]},
    {title:"Työn vaatimusten ja voimavarojen malli (JD-R)", type:"list", items:[
      "[V] Motivaatiopolku: työn voimavarat → työn imu → myönteiset seuraukset (sitoutuminen, suoriutuminen).",
      "[V] Terveyttä heikentävä polku: työn vaatimukset → työuupumus → terveys- ja työkykyhaitat.",
      "[V] Schaufeli & Bakker (2004): uupumusta ennustivat pääasiassa vaatimukset, työn imua vain voimavarat – siksi uupumuksen ehkäisy ja työn imun lisääminen vaativat osin eri keinoja.",
      "[V] Voimavarat motivoivat myös sisäisesti, koska ne tyydyttävät perustarpeita (yhtymäkohta SDT:hen) (Hakanen 2011)."
    ]},
    {title:"Mittaaminen ja suomalaiset tulokset", type:"list", items:[
      "[V] UWES-mittari (Utrecht Work Engagement Scale): 17 tai lyhyt 9 väittämän versio, asteikko 0–6 (”ei koskaan”–”päivittäin”).",
      "[V] Hammaslääkäritutkimus: työn voimavarat ennustivat työn imua, työn imu aloitteellisuutta ja aloitteellisuus työyksikön innovatiivisuutta – myönteinen spiraali (Hakanen ym. 2008, tiivistelmä).",
      "[V] Seitsemän vuoden seurannassa työn imulla oli pitkäaikaisia myönteisiä yhteyksiä hyvinvointiin ja terveyteen, ja se voi tarttua työtoverista toiseen; ”pimeää puolta” ei löytynyt (Hakanen & Perhoniemi 2012).",
      "[V] Omaa työn imua voi vahvistaa työn tuunaamisella (job crafting) ja riittävällä palautumisella."
    ]},
    {title:"Työhyvinvoinnin nelikenttä", type:"text", text:"[V] Mielihyvä–mielipaha × virittyneisyys (Warr; Hakanen): työn imu = innostus (mielihyvä + korkea vireys), työholismi ja stressi = ahdistus, työuupumus ja leipääntyminen = masennus, työtyytyväisyys = viihtyminen (Hakanen 2011, kuva 1)."}
  ],

{
  id:"m2_tyotavoitteet", category:"m_tyo", book:"mml",
  name:"Henkilökohtaiset työtavoitteet ja hyvinvointi (Hyvönen & Feldt)",
  source:"Hyvönen & Feldt, s. 133–148; Hyvönen (2011) väitöskirja",
  badges:[{label:"MML Osa II"},{label:"Työtavoitteet"}],
  sourceStatus:"[V] Sisältö Hyvösen väitöskirjasta (2011; ohjaajina Feldt ja Salmela-Aro) ja siihen liittyvistä artikkeleista. [EI LÖYTYNYT] Luvun omaa tekstiä tai sen mahdollisia käytännön suosituksia ei saatavilla.",
  tags:{tyo:true, hyvinvointi:true, mittaaminen:true, mml:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Henkilökohtaiset työtavoitteet ovat työntekijän työ- ja urasuuntautuneita tavoitteita, jotka heijastavat sekä yksilöä että työympäristöä. Hyvinvoinnille ei ole tärkeää vain se, miksi jotain tavoitellaan, vaan myös se, mitä tavoitellaan (Hyvönen 2011)."},
    {title:"Teoriatausta", type:"list", items:[
      "[V] Littlen sosiaaliekologinen malli ja henkilökohtaisen toiminnan rakenteet: projektit (Little), pyrkimykset (Emmons), elämäntehtävät (Cantor), tulevaisuuden tavoitteet (Nurmi), huolenaiheet (Klinger), mahdolliset minät (Markus & Nurius).",
      "[V] Työoloja kuvattiin ponnistusten ja palkkioiden epäsuhdan mallilla (ERI, Siegrist): stressiriski on suuri, kun ponnistukset ja palkkiot ovat epäsuhdassa, erityisesti jos työntekijä on ylisitoutunut."
    ]},
    {title:"Nuorten esihenkilöiden työtavoitteet (N = 747, seuranta 2 v)", type:"list", items:[
      "[V] Seitsemän tavoiteluokkaa: ammatillinen osaaminen (30,5 %), eteneminen uralla (23,7 %), työssä jaksaminen ja viihtyminen (15,2 %), uusi työ tai yrittäjyys (13,7 %), työn jatkuvuus (7,4 %), organisaation menestyksekäs toiminta (5,6 %), palkka (3,9 %).",
      "[V] Paras työhyvinvointi (vähiten uupumusta, eniten työn imua) oli niillä, joiden tavoitteet liittyivät organisaation menestykseen; heikoin jaksamis- ja viihtymistavoitteiden sekä uuden työn tavoitteiden asettajilla.",
      "[V] Tavoitteet välittivät työolojen (erityisesti palkkioiden) yhteyttä työhyvinvointiin.",
      "[V] Palkkioiden lisääntyminen oli yhteydessä osaamis- ja organisaatiotavoitteisiin, vähentyminen uuden työn tavoitteisiin; tavoitteet muuttuvat lyhyelläkin aikavälillä."
    ]},
    {title:"Laajennus: eettinen organisaatiokulttuuri", type:"list", items:[
      "[V] Johtajilla eettisemmäksi koettu kulttuuri oli yhteydessä organisaatio- ja vaikutusvaltatavoitteisiin sekä suoraan korkeampaan työn imuun; heikompi eettinen kulttuuri uran päättämis-, vaihto- ja etenemistavoitteisiin (Huhtala ym. 2013)."
    ]},
    {title:"Muista tentissä", type:"list", items:[
      "Rinnasta Salmela-Aron ja Nurmen havaintoon: itseen kohdistuvat tavoitteet liittyvät heikompaan hyvinvointiin – työssä jaksamistavoitteet voivat heijastaa jo koettua kuormitusta. [T] Syy-seuraussuuntaa ei voi päätellä poikkileikkauksesta.",
      "Menetelmä on sama kuin Osan I tavoitemenetelmässä: sisällönanalyysi + tavoitearvioinnit."
    ]}
  ],

{
  id:"m2_digitalisaatio", category:"m_tyo", book:"mml",
  name:"Digitalisoituvan työelämän liikevoimat (Vartiainen)",
  source:"Vartiainen, M., s. 149–163",
  badges:[{label:"MML Osa II"},{label:"Mobiili työ"}],
  sourceStatus:"[V-2nd] Juvosen arvio kuvaa kirjan digitaalisen työn teemaa, mutta ei varmasti tästä luvusta. [V] Mobiilin ja monipaikkaisen työn käsitteet Vartiaisen omista julkaisuista (2010, 2014, 2019). [EI LÖYTYNYT] Luvun omaa tekstiä eikä Vartiaisen ”liikevoimat”-jäsennystä löytynyt – tämä kortti on kirjan osalta ohuin.",
  tags:{tyo:true, sosiokulttuurinen:true, mml:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V-2nd] Juvosen mukaan kirja kuvaa työelämää, joka haastaa tulevien sukupolvien voimavarat ja syyt tehdä töitä: uudet sukupolvet joko sopeutuvat muuttuneisiin oloihin tai pyrkivät muuttamaan niitä tarpeidensa mukaisiksi. Digitaalisessa työssä korostuvat sisäinen motivaatio, työn imu, itseohjautuvuus ja jatkuva oppiminen."},
    {title:"Mobiili ja monipaikkainen työ (Vartiaisen tutkimus)", type:"list", items:[
      "[V] Teknologia mahdollistaa työn paikasta ja ajasta riippumatta; joustavuus voi tukea innovatiivisuutta ja hyvinvointia, mutta hallitsemattomana heikentää työhyvinvointia (Hyrkkänen & Vartiainen 2019).",
      "[V] Vaativuustekijät: matkustaminen, monipaikkaisuus, uudella tavalla rakentuva työaika, projektimaisuus, välittynyt vuorovaikutus ja toimiminen eri kulttuureissa.",
      "[V-abs] Jatkuvasti muuttuvat fyysiset, virtuaaliset ja sosiaaliset ympäristöt herättävät sekä hyvinvoinnin että stressin kokemuksia (Vartiainen & Hyrkkänen 2010)."
    ]},
    {title:"Työn muotoilu eli tuunaaminen", type:"list", items:[
      "[V] Työntekijä muokkaa työn sisältöä, sosiaalisia suhteita ja työn kognitiivista hahmottamista (Wrzesniewski & Dutton 2001); mobiilissa työssä myös työaikaa, työtiloja ja välittynyttä vuorovaikutusta.",
      "[V] Juuret työn piirreteoriassa (Hackman & Oldham): taitojen monipuolisuus, työn kokonaisuus, merkityksellisyys, itsenäisyys ja palaute; JD-R-kehyksessä tuunaaminen → työn imu → suoriutuminen."
    ]},
    {title:"Yhteys muihin lukuihin", type:"list", items:[
      "[V] Upadyaya, Vartiainen & Salmela-Aro (2016, N = 1 415): palveleva johtaminen oli yhteydessä työn imuun, ja suuri työmäärä uupumukseen ja masennusoireisiin.",
      "[T] Itseohjautuvuus ja autonomia mobiilissa työssä kytkeytyvät SDT:n autonomian tarpeeseen – yhteys päätelty, ei varmistettu luvusta."
    ]}
  ],

{
  id:"m2_urasiirtymat", category:"m_tyo", book:"mml",
  name:"Tavoitteellisuuden ja hyvinvoinnin vahvistaminen työuralla (Vuori)",
  source:"Vuori, J., s. 164–176; Vuori, Wallin & Kirves (2017)",
  badges:[{label:"MML Osa II"},{label:"Interventiot"}],
  sourceStatus:"[V] Johdannon maininta sosiaalisen oppimisen teoriasta Osassa II. [V] Menetelmät ja tulokset Vuoren omista Työterveyslaitoksen raporteista ja artikkeleista. [EI LÖYTYNYT] Luvun omaa tekstiä ei saatavilla.",
  tags:{tyo:true, elamankulku:true, hyvinvointi:true, mml:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Urasiirtymiin voi valmistautua: koetun pystyvyyden ja vastoinkäymisiin varautumisen vahvistamista kutsutaan valmistautuneisuuden vahvistamiseksi (Vuori & Vinokur 2005). Valmistautunut työntekijä tekee suunnitelmia, asettaa tulevaisuutta parantavia tavoitteita ja arvioi mahdollisuuksiaan saavuttaa ne (Vuori ym. 2017)."},
    {title:"Ryhmämenetelmien periaatteet", type:"list", items:[
      "[V] Teoriapohja: sosiaalisen oppimisen teoria (Bandura), suunnitellun toiminnan teoria (Ajzen) ja ennakoiva stressinhallinta (Meichenbaum).",
      "[V] Aktiivisen oppimisen menetelmät ja vertaisryhmän sosiaalinen tuki; kaksi kouluttajaa (esim. henkilöstöhallinnosta ja työterveyshuollosta).",
      "[V] Vastoinkäymisiin varautuminen: takaiskuja ennakoidaan ja harjoitellaan, ja virheet hyväksytään oppimismahdollisuuksina – tämä ylläpitää sitoutumista tavoitteisiin.",
      "[V] Menetelmiä eri siirtymiin: työttömien uudelleentyöllistyminen (Työhön), koulutuksesta työelämään, työuran keskivaihe (Työuran uurtaja) ja seniorivaihe."
    ]},
    {title:"Tuloksia", type:"list", items:[
      "[V] Kenttäkokeissa sisäinen motivaatio työhön liittyviin tavoitteisiin lisääntyi, kun valmistautuneisuutta vahvistettiin vertaisryhmässä.",
      "[V-abs] Työhön-ohjelma (N = 1 261 työnhakijaa): paransi uudelleentyöllistymisen laatua ja vähensi psyykkistä kuormittuneisuutta.",
      "[V-abs] Organisaatiotason RCT (17 organisaatiota, N = 718): masennusoireet ja varhaiseläkeaikeet vähenivät; vaikutus välittyi uranhallinnan valmistautuneisuuden kautta, ja eniten hyötyivät oireilevat ja nuoremmat.",
      "[V] Seniorivaihe (699 työntekijää): puolen vuoden kuluttua työn imu ja tulevaisuusorientaatio olivat vahvistuneet ja ikäsyrjinnän kokemukset vähentyneet (Vuori, Wallin & Kirves 2017)."
    ]},
    {title:"Muista tentissä", type:"list", items:[
      "Kytke 4S-malliin: siirtymät kanavoivat tavoitteita, ja valmistautuneisuus tukee valintaa ja sopeutumista.",
      "Pystyvyys (self-efficacy) on Banduran käsite – vrt. odotusarvoteorian onnistumisodotukset."
    ]}
  ],

{
  id:"m3_urheilu", category:"m_hyvinvointi", book:"mml",

  sourceStatus:"[V] Johdannon kuvaus tavoiteorientaatioteoriasta urheiluvalmennuksessa. [V] Käsitteet Liukkosen omasta artikkelista (2008, kokoteksti). [V-abs] Suomalaiset tulokset kirjoittajien artikkelien tiivistelmistä. [EI LÖYTYNYT] Luvun omaa tekstiä ei saatavilla.",
  tags:{liikunta:true, teoria:true, oppiminen:true, mml:true, yhteys:true},
  sections:[
    {title:"Ydinajatus", type:"text", text:"[V] Olennaista on, perustuuko pätevyyden tunne itsevertailuun (tehtäväsuuntautuneisuus) vai normatiiviseen vertailuun muihin (minä- eli kilpailusuuntautuneisuus). Orientaatiot toimivat kuin linsseinä, ja ohjaajan luoma motivaatioilmasto vahvistaa jompaakumpaa (Liukkonen 2008)."},
    {title:"Tehtävä- ja minäorientaatio", type:"list", items:[

const COURSES = [MT_COURSE].concat(typeof PP2_COURSE !== "undefined" ? [PP2_COURSE] : []);
const DEFAULT_COURSE_ID = COURSES[COURSES.length-1].id;
const NAV_DEFAULTS = {};
$all(".nav-btn").forEach(function(b){
  NAV_DEFAULTS[b.dataset.view] = {icon:b.querySelector(".icon").textContent, label:b.textContent.replace(b.querySelector(".icon").textContent, "").trim()};
});

function applyCourseNav(c){
  $all(".nav-btn").forEach(function(b){
    const view = b.dataset.view;
    const conf = Object.assign({}, NAV_DEFAULTS[view], (c.nav||{})[view] || {});
    b.innerHTML = '<span class="icon">'+conf.icon+'</span>'+escapeHtml(conf.label);
    const bank = ["mcq","tf","short","essay","vignette","diagdrill","devchallenge"].indexOf(view)>-1 ? bankForMode(view) : null;
    const hidden = conf.hidden || (bank && bank.length===0) || (view==="compare" && !COMPARISON_PAIRS.length && !TOPICS.length) || (view==="lifecycle" && !LIFECYCLE_STAGES.length);
    b.style.display = hidden ? "none" : "";
  });
}
function renderCourseSwitch(){
  const el = document.getElementById("course-switch-list");
  el.innerHTML = COURSES.map(function(c){
    return '<button class="course-btn'+(COURSE && COURSE.id===c.id ? ' active' : '')+'" data-course="'+c.id+'">'+c.icon+' '+escapeHtml(c.switchLabel)+'<small>'+escapeHtml(c.switchSub)+'</small></button>';
  }).join("");
  $all(".course-btn", el).forEach(function(b){
    b.addEventListener("click", function(){ if(!COURSE || COURSE.id!==b.dataset.course) activateCourse(b.dataset.course); });
  });
}
function activateCourse(id, opts){
  const c = byId(COURSES, id) || COURSES[0];
  COURSE = c;
  const d = c.data;
  CATEGORIES = d.CATEGORIES; TOPICS = d.TOPICS; COMPARISON_PAIRS = d.COMPARISON_PAIRS; LIFECYCLE_STAGES = d.LIFECYCLE_STAGES;
  MCQ_BANK = d.MCQ_BANK; TF_BANK = d.TF_BANK; SHORT_BANK = d.SHORT_BANK; ESSAY_BANK = d.ESSAY_BANK; VIGNETTE_BANK = d.VIGNETTE_BANK;
  DIAGDRILL_BANK = d.DIAGDRILL_BANK; FLASHCARD_BANK = d.FLASHCARD_BANK; DEVCHALLENGE_BANK = d.DEVCHALLENGE_BANK;
  EXAM_BLUEPRINT = d.EXAM_BLUEPRINT; OVERVIEW_GROUPS = d.OVERVIEW_GROUPS;
  STORAGE_KEY = c.storageKey;
  STATE = loadState();
  try{ localStorage.setItem("suvi_active_course", c.id); }catch(e){ /* ei tallennusta */ }
  try{ if(location.hash !== "#kurssi="+c.id) history.replaceState(null, "", "#kurssi="+c.id); }catch(e){ /* esim. data:-osoite */ }
  document.getElementById("course-title").textContent = c.title;
  document.getElementById("course-subtitle").textContent = c.subtitle;
  document.title = c.title + " – tenttivalmennus";
  applyCourseNav(c);
  renderCourseSwitch();
  if(!(opts && opts.skipNavigate)) navigateTo("home");
}
function courseFromHash(){
  const m = /kurssi=([a-z0-9_-]+)/i.exec(location.hash || "");
  return m && byId(COURSES, m[1]) ? m[1] : null;
}
window.addEventListener("hashchange", function(){
  const id = courseFromHash();
  if(id && (!COURSE || COURSE.id!==id)) activateCourse(id);
});

/* =========================================================================
   INIT
   ========================================================================= */
(function initApp(){
  let savedCourse = null, savedTheme = null;
  try{ savedCourse = localStorage.getItem("suvi_active_course"); savedTheme = localStorage.getItem("suvi_theme"); }catch(e){ /* ei tallennusta */ }
  const startId = courseFromHash() || (savedCourse && byId(COURSES, savedCourse) ? savedCourse : DEFAULT_COURSE_ID);
  activateCourse(startId, {skipNavigate:true});
  document.documentElement.setAttribute("data-theme", savedTheme || STATE.theme || "light");
  navigateTo("home");
})();
</script>
