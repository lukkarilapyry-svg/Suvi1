<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suvin tenttivalmennus</title>
<style>
:root{
  --bg: #f4f6f8;
  --bg-panel: #ffffff;
  --bg-panel-alt: #eef1f4;
  --text: #1e2733;
  --text-muted: #5a6b7a;
  --border: #d7dee4;
  --accent: #2b6777;
  --accent-dark: #1d4c58;
  --accent-light: #dceef1;
  --good: #2e7d4f;
  --good-bg: #e5f4ea;
  --bad: #b3432b;
  --bad-bg: #fbe9e5;
  --warn: #9a6b1c;
  --warn-bg: #fbf1de;
  --shadow: 0 1px 3px rgba(20,30,40,0.08), 0 1px 2px rgba(20,30,40,0.06);
  --radius: 10px;
  --sidebar-w: 250px;
}
:root[data-theme="dark"]{
  --bg: #141a20;
  --bg-panel: #1c242c;
  --bg-panel-alt: #232d36;
  --text: #e6edf2;
  --text-muted: #93a3b0;
  --border: #33404a;
  --accent: #5fb3c7;
  --accent-dark: #8fd0df;
  --accent-light: #223941;
  --good: #6cc297;
  --good-bg: #163224;
  --bad: #e08469;
  --bad-bg: #3a201b;
  --warn: #e0b767;
  --warn-bg: #362a15;
  --shadow: 0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  line-height:1.55;
  min-height:100vh;
}
#app{display:flex;min-height:100vh;}
a{color:var(--accent-dark);}

/* ---------- Sidebar ---------- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-panel);
  border-right:1px solid var(--border);
  padding:16px 10px 24px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
#sidebar h1{
  font-size:16px;
  margin:4px 6px 2px;
  color:var(--accent-dark);
  line-height:1.3;
}
#sidebar .subtitle{
  font-size:11.5px;
  color:var(--text-muted);
  margin:0 6px 16px;
}
.nav-group{margin-bottom:14px;}
.nav-group-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-muted);
  margin:10px 8px 6px;
  font-weight:600;
}
.nav-btn{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--text);
  padding:8px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:13.5px;
  margin-bottom:2px;
}
.nav-btn:hover{background:var(--bg-panel-alt);}
.nav-btn.active{background:var(--accent); color:#fff;}
.nav-btn .icon{width:18px; text-align:center; flex-shrink:0;}
#theme-toggle{
  width:100%;
  margin-top:10px;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg-panel-alt);
  color:var(--text);
  cursor:pointer;
  font-size:12.5px;
}

/* ---------- Main ---------- */
#main{flex:1; min-width:0; padding:26px 30px 60px; max-width:980px;}
.view{display:none;}
.view.active{display:block;}
h2.view-title{
  font-size:22px;
  margin:0 0 4px;
  color:var(--accent-dark);
}
.view-lead{color:var(--text-muted); font-size:14px; margin:0 0 20px;}

.card{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card h3{margin-top:0;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:760px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
}

.btn{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  border:none;
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:13.5px;
  font-weight:500;
}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--bg-panel-alt); color:var(--text); border:1px solid var(--border);}
.btn.secondary:hover{background:var(--accent-light);}
.btn.small{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}

.tag{
  display:inline-block;
  font-size:11px;
  padding:2px 8px;
  border-radius:999px;
  background:var(--accent-light);
  color:var(--accent-dark);
  margin:0 4px 4px 0;
  border:1px solid var(--border);
}
.tag.onset-lapsuus{background:#e4f1e0; color:#3a6b2b;}
.tag.onset-nuoruus{background:#fdf0da; color:#8a5a10;}
.tag.onset-aikuisuus{background:#e4e9fb; color:#33469a;}
:root[data-theme="dark"] .tag.onset-lapsuus{background:#213a1a; color:#9ed48c;}
:root[data-theme="dark"] .tag.onset-nuoruus{background:#3d2f10; color:#f0c67d;}
:root[data-theme="dark"] .tag.onset-aikuisuus{background:#212a49; color:#a9b8f0;}

.flag-verify{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11.5px;
  color:var(--warn);
  background:var(--warn-bg);
  border:1px solid var(--warn);
  padding:3px 8px;
  border-radius:6px;
  margin:6px 0;
}

.badge{
  display:inline-block;
  font-size:11px;
  padding:2px 7px;
  border-radius:5px;
  font-weight:600;
}
.badge.dsm5{background:#e4e9fb; color:#33469a;}
.badge.icd10{background:#f3e6f8; color:#7a3b93;}
:root[data-theme="dark"] .badge.dsm5{background:#212a49; color:#a9b8f0;}
:root[data-theme="dark"] .badge.icd10{background:#3a2440; color:#dcaef0;}

input[type=text],input[type=search],textarea,select{
  width:100%;
  font-family:inherit;
  font-size:13.5px;
  padding:9px 11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
}
textarea{min-height:110px; resize:vertical;}
label{font-size:13px; color:var(--text-muted);}

table{border-collapse:collapse; width:100%; font-size:13px;}
table th, table td{
  border:1px solid var(--border);
  padding:8px 10px;
  vertical-align:top;
  text-align:left;
}
table th{background:var(--bg-panel-alt);}

.section-block{margin-bottom:16px;}
.section-block h4{
  margin:0 0 6px;
  font-size:13.5px;
  color:var(--accent-dark);
  text-transform:uppercase;
  letter-spacing:.03em;
}
.section-block ul{margin:4px 0; padding-left:20px;}
.section-block li{margin-bottom:3px;}

.dev-cols{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:6px;}
@media (max-width:760px){.dev-cols{grid-template-columns:1fr;}}
.dev-col{
  background:var(--bg-panel-alt);
  border-radius:8px;
  padding:10px 12px;
  border:1px solid var(--border);
}
.dev-col h5{margin:0 0 6px; font-size:12px; color:var(--accent-dark);}

.progress-bar-outer{
  background:var(--bg-panel-alt);
  border-radius:6px;
  height:10px;
  overflow:hidden;
  border:1px solid var(--border);
}
.progress-bar-inner{height:100%; background:var(--accent);}
.progress-bar-inner.bad{background:var(--bad);}
.progress-bar-inner.warn{background:var(--warn);}
.progress-bar-inner.good{background:var(--good);}

.option-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:8px;
  cursor:pointer;
  background:var(--bg-panel);
}
.option-row:hover{background:var(--bg-panel-alt);}
.option-row.selected{border-color:var(--accent); background:var(--accent-light);}
.option-row.correct{border-color:var(--good); background:var(--good-bg);}
.option-row.incorrect{border-color:var(--bad); background:var(--bad-bg);}
.option-row input{margin-top:3px;}

.feedback-box{
  border-radius:8px;
  padding:12px 14px;
  margin-top:12px;
  font-size:13.5px;
}
.feedback-box.correct{background:var(--good-bg); border:1px solid var(--good); color:var(--text);}
.feedback-box.incorrect{background:var(--bad-bg); border:1px solid var(--bad); color:var(--text);}
.feedback-box.neutral{background:var(--bg-panel-alt); border:1px solid var(--border);}

.q-meta{font-size:11.5px; color:var(--text-muted); margin-bottom:6px;}
.q-progress{font-size:12px; color:var(--text-muted); margin-bottom:10px;}

.rubric-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:6px 0;
  border-bottom:1px dashed var(--border);
  font-size:13px;
}
.rubric-row:last-child{border-bottom:none;}
.rubric-pts{font-size:11.5px; color:var(--text-muted); white-space:nowrap;}

.chip-filter{
  display:inline-block;
  font-size:12.5px;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--bg-panel);
  cursor:pointer;
  margin:0 6px 6px 0;
}
.chip-filter.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.flashcard{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:14px;
  min-height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  cursor:pointer;
  font-size:16px;
  box-shadow:var(--shadow);
}
.flashcard .fc-label{
  position:absolute;
  margin-top:-90px;
  font-size:11px;
  color:var(--text-muted);
  text-transform:uppercase;
}
.flashcard-wrap{position:relative; max-width:560px; margin:0 auto;}

.timeline{position:relative; padding-left:26px; margin-top:20px;}
.timeline:before{
  content:"";
  position:absolute; left:8px; top:4px; bottom:4px; width:2px;
  background:var(--border);
}
.timeline-stage{position:relative; margin-bottom:26px;}
.timeline-stage:before{
  content:"";
  position:absolute; left:-26px; top:4px;
  width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:3px solid var(--bg);
  box-shadow:0 0 0 2px var(--accent);
}
.timeline-stage h3{margin:0 0 4px; color:var(--accent-dark);}
.timeline-stage .stage-range{font-size:12px; color:var(--text-muted); margin-bottom:8px;}

.small-muted{font-size:12px; color:var(--text-muted);}
.hr-soft{border:none; border-top:1px solid var(--border); margin:16px 0;}
.two-col-compare{display:grid; gap:0; overflow-x:auto;}
.compare-table td, .compare-table th{min-width:160px;}
.stat-pill{display:inline-flex; align-items:center; gap:6px; background:var(--bg-panel-alt); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12.5px; margin:0 6px 6px 0;}

.search-box{margin-bottom:16px;}
.topic-list-item{
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:6px;
  cursor:pointer;
  background:var(--bg-panel);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.topic-list-item:hover{background:var(--bg-panel-alt);}
.topic-list-item .name{font-weight:600; font-size:14px;}
.back-link{cursor:pointer; color:var(--accent-dark); font-size:13px; margin-bottom:10px; display:inline-block;}

.disclaimer{
  font-size:12.5px;
  background:var(--warn-bg);
  border:1px solid var(--warn);
  border-radius:8px;
  padding:12px 14px;
  color:var(--text);
  margin-bottom:18px;
}
.disclaimer strong{color:var(--warn);}

.course-btn{
  display:block; width:100%; text-align:left;
  border:1px solid var(--border); background:var(--bg-panel-alt); color:var(--text);
  padding:8px 10px; border-radius:8px; margin-bottom:6px; cursor:pointer;
  font-size:13px; line-height:1.3; font-family:inherit;
}
.course-btn small{display:block; color:var(--text-muted); font-size:11px; font-weight:400;}
.course-btn:hover{background:var(--accent-light);}
.course-btn.active{border-color:var(--accent); background:var(--accent-light); font-weight:600; box-shadow:inset 3px 0 0 var(--accent);}
.mark{
  display:inline-block; font-size:10.5px; font-weight:700; line-height:1.4;
  padding:0 5px; border-radius:4px; margin-right:4px; vertical-align:1px; cursor:help;
}
.mark-v{background:var(--good-bg); color:var(--good); border:1px solid var(--good);}
.mark-t{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn);}
.mark-x{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad);}
.source-status{
  font-size:12.5px; border-radius:8px; padding:9px 12px; margin:8px 0 14px;
  background:var(--bg-panel-alt); border:1px solid var(--border);
}
.ref-list li{font-size:12.5px; color:var(--text-muted);}
.ref-list a{color:var(--accent-dark);}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

@media (max-width:820px){
  #app{flex-direction:column;}
  #sidebar{
    width:100%; height:auto; position:relative;
    display:flex; flex-wrap:wrap; align-items:center;
    padding:10px;
  }
  #sidebar h1{width:100%;}
  .nav-group{display:flex; flex-wrap:wrap; margin-bottom:6px; width:100%;}
  .nav-group-title{width:100%;}
  .nav-btn{width:auto;}
  #main{padding:18px 16px 60px; max-width:100%;}
  .dev-cols{grid-template-columns:1fr !important;}
  .course-btn{display:inline-block; width:auto; margin-right:6px;}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <h1 id="course-title">Mielenterveyden häiriöt</h1>
    <div class="subtitle" id="course-subtitle">Tenttivalmennus · aineopinnot</div>

    <div class="nav-group">
      <div class="nav-group-title">Opintojakso</div>
      <div id="course-switch-list" style="width:100%"></div>
    </div>

    <div class="nav-group">
      <div class="nav-group-title">Aloitus</div>
      <button class="nav-btn" data-view="home"><span class="icon">🏠</span>Etusivu</button>
      <button class="nav-btn" data-view="stats"><span class="icon">📊</span>Omat tilastot</button>
    </div>

    <div class="nav-group">
      <div class="nav-group-title">Opiskele</div>
      <button class="nav-btn" data-view="theory"><span class="icon">📖</span>Teoria</button>
      <button class="nav-btn" data-view="compare"><span class="icon">⚖️</span>Vertailu</button>
      <button class="nav-btn" data-view="lifecycle"><span class="icon">🧬</span>Elämänkaari</button>
      <button class="nav-btn" data-view="overview"><span class="icon">🗺️</span>Kokonaisuudet</button>
    </div>

    <div class="nav-group">
      <div class="nav-group-title">Harjoittele</div>
      <button class="nav-btn" data-view="diagdrill"><span class="icon">🔎</span>Diagnostiikka</button>
      <button class="nav-btn" data-view="vignette"><span class="icon">🧩</span>Tapaukset</button>
      <button class="nav-btn" data-view="mcq"><span class="icon">☑️</span>Monivalinta</button>
      <button class="nav-btn" data-view="tf"><span class="icon">✅</span>Oikein / väärin</button>
      <button class="nav-btn" data-view="short"><span class="icon">✍️</span>Avoimet kysymykset</button>
      <button class="nav-btn" data-view="essay"><span class="icon">📝</span>Esseet</button>
      <button class="nav-btn" data-view="flashcards"><span class="icon">🃏</span>Flashcardit</button>
      <button class="nav-btn" data-view="devchallenge"><span class="icon">⏳</span>Kehityshaaste</button>
      <button class="nav-btn" data-view="random"><span class="icon">🎲</span>Satunnaisharjoittelu</button>
    </div>

    <div class="nav-group">
      <div class="nav-group-title">Testaa</div>
      <button class="nav-btn" data-view="weak"><span class="icon">🎯</span>Heikot alueet</button>
      <button class="nav-btn" data-view="exam"><span class="icon">🏁</span>Harjoitustentti</button>
    </div>

    <button id="theme-toggle">🌓 Vaihda teema</button>
  </nav>

  <main id="main">
    <div class="view" id="view-home"></div>
    <div class="view" id="view-stats"></div>
    <div class="view" id="view-theory"></div>
    <div class="view" id="view-compare"></div>
    <div class="view" id="view-lifecycle"></div>
    <div class="view" id="view-overview"></div>
    <div class="view" id="view-diagdrill"></div>
    <div class="view" id="view-vignette"></div>
    <div class="view" id="view-mcq"></div>
    <div class="view" id="view-tf"></div>
    <div class="view" id="view-short"></div>
    <div class="view" id="view-essay"></div>
    <div class="view" id="view-flashcards"></div>
    <div class="view" id="view-devchallenge"></div>
    <div class="view" id="view-random"></div>
    <div class="view" id="view-weak"></div>
    <div class="view" id="view-exam"></div>
  </main>
</div>

<script>
"use strict";
/* =========================================================================
   AKTIIVISEN OPINTOJAKSON DATA
   Nämä muuttujat asetetaan activateCourse()-funktiossa sen mukaan, mikä
   opintojakso on valittuna. Kunkin opintojakson oma data on nimetty
   etuliitteellä (MT_ = Mielenterveyden häiriöt, PP2_ = Persoonallisuuspsykologia II).
   ========================================================================= */
let CATEGORIES = [], TOPICS = [], COMPARISON_PAIRS = [], LIFECYCLE_STAGES = [];
let MCQ_BANK = [], TF_BANK = [], SHORT_BANK = [], ESSAY_BANK = [], VIGNETTE_BANK = [];
let DIAGDRILL_BANK = [], FLASHCARD_BANK = [], DEVCHALLENGE_BANK = [];
let EXAM_BLUEPRINT = {}, OVERVIEW_GROUPS = [], COURSE = null;

/* =========================================================================
   OPINTOJAKSO: MIELENTERVEYDEN HÄIRIÖT – DATA
   ========================================================================= */
const MT_CATEGORIES = [
  {id:"luokittelu", name:"Diagnostiikka, luokittelu ja epidemiologia", description:"Yleiskäsitteet: DSM-5 ja ICD-10 -luokitusten periaatteet, kehityksellinen psykopatologia ja lasten/nuorten häiriöiden yleisyys."},
  {id:"neurokehitys", name:"Neurokehitykselliset häiriöt", description:"Älyllinen kehitysvamma, kielelliset ja motoriset kehityshäiriöt, oppimisvaikeudet, autismikirjo, ADHD sekä tic-häiriöt."},
  {id:"varhainen_vuorovaikutus", name:"Varhaisen vuorovaikutuksen ja sosiaalisen kehityksen häiriöt", description:"Kiintymyssuhdehäiriöt ja valikoiva puhumattomuus – varhaislapsuuden suhteiden häiriöt."},
  {id:"kayttaytymisen_saately", name:"Käytöshäiriöt ja impulssikontrollin häiriöt", description:"Uhmakkuushäiriö, käytöshäiriö, epäsosiaalinen persoonallisuushäiriö ja muut hillitsemishäiriöt kehityksellisenä jatkumona."},
  {id:"psykoosit", name:"Skitsofrenia ja muut psykoosisairaudet", description:"Psykoottiset häiriöt aikuisilla sekä niiden harvinaisempi ja erotusdiagnostisesti haastava ilmeneminen lapsuudessa/nuoruudessa."},
  {id:"kaksisuuntaiset", name:"Kaksisuuntaiset mielialahäiriöt", description:"Maanis-depressiivinen sairaus ja sen tunnistamisen erityishaasteet lapsilla ja nuorilla."},
  {id:"depressiiviset", name:"Depressiiviset häiriöt", description:"Masennustilat ja pitkittynyt masennus eri ikävaiheissa."},
  {id:"ahdistuneisuus", name:"Ahdistuneisuushäiriöt", description:"Eroahdistuksesta paniikkihäiriöön – ahdistuneisuuden muodot lapsuudesta aikuisuuteen."},
  {id:"pakko-oireiset", name:"Pakko-oireiset ja liitännäishäiriöt", description:"Pakko-oireinen häiriö sekä siihen läheisesti liittyvät kehon kuvan ja toistuvan käyttäytymisen häiriöt."},
  {id:"trauma_stressi", name:"Kriisit, sopeutumishäiriöt ja traumaperäiset häiriöt", description:"Äkillisten ja pitkittyneiden stressitilanteiden aiheuttamat oireyhtymät."},
  {id:"dissosiaatio", name:"Dissosiaatiohäiriöt", description:"Tietoisuuden, identiteetin ja muistin eheyden häiriintyminen."},
  {id:"somaattiset", name:"Elimellisoireiset ja somaattisesti ilmenevät häiriöt", description:"Kun psyykkinen kuormitus ilmenee ensisijaisesti kehollisina oireina – lapsilla ja aikuisilla."},
  {id:"syomishairiot", name:"Syömishäiriöt ja syömiskäyttäytymisen häiriöt", description:"Varhaislapsuuden syömisongelmista nuoruusiän ja aikuisuuden syömishäiriöihin."},

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function escapeHtml(str){
  if(str==null) return "";
  return String(str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function pickRandom(arr, n){ return shuffle(arr).slice(0, n); }
function byId(arr, id){ return arr.find(function(x){ return x.id===id; }); }
function pct(a,b){ return b>0 ? Math.round((a/b)*100) : 0; }
function ul(items){
  if(!items || !items.length) return "";
  return "<ul>" + items.map(function(i){ return "<li>"+escapeHtml(i)+"</li>"; }).join("") + "</ul>";
}
function fmtList(items){ return items && items.length ? items.join(", ") : ""; }
function topicCategoryName(catId){
  const c = byId(CATEGORIES, catId);
  return c ? c.name : catId;
}
const MARK_INFO = {
  "V":      {cls:"mark-v", label:"V",  title:"Varmistettu: tieto on tarkistettu luetusta lähteestä (ks. kortin lähteet)."},
  "V-abs":  {cls:"mark-v", label:"V·abs", title:"Varmistettu vain tiivistelmästä – koko tekstiä ei luettu."},
  "V-2nd":  {cls:"mark-v", label:"V²", title:"Varmistettu toisen käden lähteestä (esim. katsaus tai kirja-arvio)."},
  "T":      {cls:"mark-t", label:"T",  title:"Taustatieto: yleisesti tunnettu käsite, jota ei ole tarkistettu tenttikirjasta – tarkista kirjasta."},
  "EI LÖYTYNYT": {cls:"mark-x", label:"ei löytynyt", title:"Tätä haettiin, mutta luotettavaa lähdettä ei löytynyt."}
};
function fmtMarked(text){
  const s = escapeHtml(text==null ? "" : text);
  return s.replace(/\[(V-abs|V-2nd|V|T|EI LÖYTYNYT)\]/g, function(m, k){
    const mi = MARK_INFO[k];
    return '<span class="mark '+mi.cls+'" title="'+mi.title+'">'+mi.label+'</span>';
  });
}
function ulMarked(items){
  if(!items || !items.length) return "";
  return "<ul>" + items.map(function(i){ return "<li>"+fmtMarked(i)+"</li>"; }).join("") + "</ul>";
}
function onsetTagsHtml(topic){
  if(topic.badges){
    return topic.badges.map(function(b){ return '<span class="tag'+(b.cls?' '+b.cls:'')+'">'+escapeHtml(b.label)+'</span>'; }).join("");
  }
  if(!topic.tags || !topic.tags.onset) return "";
  return topic.tags.onset.map(function(o){
    return '<span class="tag onset-'+o+'">'+onsetLabel(o)+'</span>';
  }).join("");
}
function onsetLabel(o){
  return {lapsuus:"alkaa tyypillisesti lapsuudessa", nuoruus:"alkaa tyypillisesti nuoruudessa", aikuisuus:"alkaa tyypillisesti aikuisuudessa"}[o] || o;
}

let STORAGE_KEY = "mtha_progress_v1"; /* vaihtuu opintojakson mukaan */
function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
  let parsed = null;
  try{ parsed = raw ? JSON.parse(raw) : null; }catch(e){ parsed = null; }
  return Object.assign({
    theme: "light",
    categoryStats: {},      // { catId: {correct:0-1 sum, total:0-1 sum, attempts:n} }
    flashcardStatus: {},    // { cardId: 'osaan'|'osittain'|'ei' }
    examHistory: [],        // [{date, score, max, pct, passed, byCategory}]
    answeredIds: {}         // { questionId: true } - lievä duplikaattien esto satunnaistilassa
  }, parsed || {});
}
let STATE = loadState();
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){ /* localStorage ei käytettävissä */ }
}
function recordCategoryResult(catId, scoreFraction){
  if(!catId) return;
  if(!STATE.categoryStats[catId]) STATE.categoryStats[catId] = {correct:0, total:0, attempts:0};
  const s = STATE.categoryStats[catId];
  s.correct += scoreFraction;
  s.total += 1;
  s.attempts += 1;
  saveState();
}
function categoryAccuracy(catId){
  const s = STATE.categoryStats[catId];
  if(!s || s.total===0) return null;
  return s.correct / s.total;
}
function allCategoryAccuracies(){
  return CATEGORIES.map(function(c){
    const s = STATE.categoryStats[c.id];
    return {
      id: c.id, name: c.name,
      attempts: s ? s.attempts : 0,
      accuracy: s && s.total>0 ? s.correct/s.total : null
    };
  });
}

   ========================================================================= */
let CURRENT_VIEW = "home";
const VIEW_RENDERERS = {}; // täytetään myöhemmin: {viewName: function(container){...}}

function navigateTo(view, params){
  CURRENT_VIEW = view;
  $all(".nav-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.view===view); });
  $all(".view").forEach(function(v){ v.classList.remove("active"); });
  const container = document.getElementById("view-"+view);
  if(container){
    container.classList.add("active");
    if(VIEW_RENDERERS[view]) VIEW_RENDERERS[view](container, params||{});
  }
  window.scrollTo(0,0);
  const main = document.getElementById("main");
  if(main) main.scrollTop = 0;
}

$all(".nav-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ navigateTo(btn.dataset.view); });
});

document.getElementById("theme-toggle").addEventListener("click", function(){
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  STATE.theme = next;
  saveState();
  try{ localStorage.setItem("suvi_theme", next); }catch(e){ /* ei tallennusta */ }
});

function renderTopicCardGeneric(topic){
  let html = '<div class="q-meta">'+escapeHtml(topic.source||"")+' &middot; Kokonaisuus: '+escapeHtml(topicCategoryName(topic.category))+'</div>';
  html += onsetTagsHtml(topic);
  if(topic.sourceStatus){ html += '<div class="source-status">'+fmtMarked(topic.sourceStatus)+'</div>'; }
  topic.sections.forEach(function(sec){
    html += '<div class="section-block"><h4>'+escapeHtml(sec.title)+'</h4>';
    if(sec.type==="list"){ html += ulMarked(sec.items); }
    else if(sec.type==="dev"){
      html += '<div class="dev-cols" style="grid-template-columns:repeat('+sec.cols.length+',1fr)">';
      html += sec.cols.map(function(c){ return '<div class="dev-col"><h5>'+escapeHtml(c.label)+'</h5><p>'+fmtMarked(c.text)+'</p></div>'; }).join("");
      html += '</div>';
    }
    else { html += '<p>'+fmtMarked(sec.text)+'</p>'; }
    html += '</div>';
  });
  if(topic.connections && topic.connections.length){
    html += '<div class="section-block"><h4>Yhteydet muihin aiheisiin</h4><div>';
    html += topic.connections.map(function(cid){
      const t = byId(TOPICS, cid);
      return t ? '<span class="tag" style="cursor:pointer" onclick="event.stopPropagation();navigateTo(\'theory\',{topicId:\''+cid+'\'})">'+escapeHtml(t.name)+'</span>' : "";
    }).join("");
    html += '</div></div>';
  }
  if(topic.references && topic.references.length){
    html += '<div class="section-block"><h4>Lähteet, joihin kortti nojaa</h4><ul class="ref-list">';
    html += topic.references.map(function(r){
      return '<li>'+fmtMarked(r.text)+(r.url ? ' – <a href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener">avaa lähde</a>' : '')+'</li>';
    }).join("");
    html += '</ul></div>';
  }
  return html;
}
function renderTopicCardFull(topic){
  if(topic.sections) return renderTopicCardGeneric(topic);
  const c = topic.core, d = topic.development;
  let html = "";
  html += '<div class="q-meta">Kirjan luku / aihe: '+escapeHtml(topic.chapterFi)+' &middot; Kokonaisuus: '+escapeHtml(topicCategoryName(topic.category))+'</div>';
  html += onsetTagsHtml(topic);
  if(topic.verifyFlag){
    html += '<div class="flag-verify">⚠ Tarkista tarkka muotoilu/kriteerit ja mahdolliset luvut suoraan tenttikirjasta – tässä yleistasoinen tiivistelmä.</div>';
  }
  html += '<div class="section-block"><h4>Ydinmääritelmä</h4><p>'+escapeHtml(c.definition)+'</p></div>';
  html += '<div class="section-block"><h4>Keskeinen oirekuva</h4>'+ul(c.symptoms)+'</div>';
  html += '<div class="section-block"><h4>Diagnostiikka</h4>';
  html += '<p><span class="badge dsm5">DSM-5</span></p>'+ul(c.dsm5);
  html += '<p><span class="badge icd10">ICD-10</span></p>'+ul(c.icd10);
  if(c.dsmIcdDiff){ html += '<p><em>DSM-5 vs. ICD-10 – huomioitava ero:</em> '+escapeHtml(c.dsmIcdDiff)+'</p>'; }
  html += '</div>';
  html += '<div class="section-block"><h4>Erotusdiagnostiikka</h4>'+ul(c.differential)+'</div>';
  html += '<div class="section-block"><h4>Tavalliset komorbiditeetit</h4>'+ul(c.comorbid)+'</div>';
  html += '<div class="section-block"><h4>Tyypillinen alkamisikä</h4><p>'+escapeHtml(c.onset)+'</p></div>';
  html += '<div class="section-block"><h4>Kehityksellinen ja elämänkaarinäkökulma</h4><div class="dev-cols">';
  html += '<div class="dev-col"><h5>Lapsuus</h5><p>'+escapeHtml(d.childhood)+'</p></div>';
  html += '<div class="dev-col"><h5>Nuoruus</h5><p>'+escapeHtml(d.adolescence)+'</p></div>';
  html += '<div class="dev-col"><h5>Aikuisuus</h5><p>'+escapeHtml(d.adulthood)+'</p></div>';
  html += '</div>';
  html += '<p style="margin-top:10px"><strong>Kulku ja ennuste:</strong> '+escapeHtml(d.course)+'</p>';
  html += '<p><strong>Kehityksellinen jatkuvuus:</strong> '+escapeHtml(d.continuity)+'</p>';
  html += '</div>';
  if(topic.connections && topic.connections.length){
    html += '<div class="section-block"><h4>Keskeiset yhteydet muihin häiriöihin</h4><div>';
    html += topic.connections.map(function(cid){
      const t = byId(TOPICS, cid);
      return t ? '<span class="tag" style="cursor:pointer" onclick="event.stopPropagation();navigateTo(\'theory\',{topicId:\''+cid+'\'})">'+escapeHtml(t.name)+'</span>' : "";
    }).join("");
    html += '</div></div>';
  }
  html += '<div class="section-block"><h4>Tentissä helposti sekoitettavat asiat</h4>'+ul(topic.confusions)+'</div>';
  html += '<div class="section-block"><h4>Keskeiset muistettavat asiat</h4>'+ul(topic.keypoints)+'</div>';
  return html;
}

VIEW_RENDERERS.stats = function(container){
  const accs = allCategoryAccuracies();
  let html = '<h2 class="view-title">Omat tilastot</h2><p class="view-lead">Tiedot perustuvat tämän selaimen aikaisempiin vastauksiisi (tallennettu localStorageen).</p>';
  html += '<div class="card"><h3>Osaaminen aihekokonaisuuksittain</h3>';
  const withAttempts = accs.filter(function(a){return a.attempts>0;});
  if(!withAttempts.length){
    html += '<p class="small-muted">Ei vielä harjoitusdataa. Aloita esim. Satunnaisharjoittelusta tai Monivalinnasta.</p>';
  } else {
    html += accs.map(function(a){
      if(a.attempts===0) return "";
      const p = Math.round(a.accuracy*100);
      const cls = p>=75?"good":(p>=50?"warn":"bad");
      return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+escapeHtml(a.name)+'</span><span>'+p+'% ('+a.attempts+' tehtävää)</span></div>'+
        '<div class="progress-bar-outer"><div class="progress-bar-inner '+cls+'" style="width:'+p+'%"></div></div></div>';
    }).join("");
  }
  html += '</div>';

  if(STATE.examHistory.length){
    html += '<div class="card"><h3>Harjoitustenttien historia</h3><table><tr><th>Ajankohta</th><th>Pisteet</th><th>%</th><th>Tulos</th></tr>';
    html += STATE.examHistory.slice().reverse().map(function(e){
      return '<tr><td>'+escapeHtml(e.date)+'</td><td>'+e.score+' / '+e.max+'</td><td>'+e.pct+' %</td><td>'+(e.passed===null||e.passed===undefined ? '–' : (e.passed?'<span class="badge dsm5" style="background:var(--good-bg);color:var(--good)">Hyväksytty</span>':'<span class="badge" style="background:var(--bad-bg);color:var(--bad)">Hylätty</span>'))+'</td></tr>';
    }).join("");
    html += '</table></div>';
  }

  html += '<div class="card"><h3>Tietojen hallinta</h3><p class="small-muted">Kaikki tieto on vain tässä selaimessa. Voit nollata edistymisen alta.</p>';
  html += '<button class="btn secondary small" id="reset-progress-btn">Nollaa tämän opintojakson tallennettu edistyminen</button></div>';

  container.innerHTML = html;
  const resetBtn = document.getElementById("reset-progress-btn");
  if(resetBtn) resetBtn.addEventListener("click", function(){
    if(confirm("Haluatko varmasti nollata opintojakson \""+COURSE.title+"\" tallennetun edistymisen tässä selaimessa? Muiden opintojaksojen tiedot säilyvät.")){
      STATE = {theme: STATE.theme, categoryStats:{}, flashcardStatus:{}, examHistory:[], answeredIds:{}};
      saveState();
      navigateTo("stats");
    }
  });
};

function renderTheoryList(container){
  let html = '<h2 class="view-title">Teoria</h2><p class="view-lead">'+COURSE.labels.theoryLead+'</p>';
  html += '<div class="search-box"><input type="search" id="theory-search" placeholder="'+COURSE.labels.theorySearch+'"></div>';
  html += '<div id="theory-list-content"></div>';
  container.innerHTML = html;

  function draw(filterText){
    const f = (filterText||"").toLowerCase().trim();
    let inner = "";
    CATEGORIES.forEach(function(cat){
      const topics = TOPICS.filter(function(t){ return t.category===cat.id && (!f || t.name.toLowerCase().indexOf(f)>-1); });
      if(!topics.length) return;
      inner += '<div class="card"><h3>'+escapeHtml(cat.name)+'</h3><p class="small-muted">'+escapeHtml(cat.description||"")+'</p>';
      inner += topics.map(function(t){
        return '<div class="topic-list-item" data-topic="'+t.id+'"><span class="name">'+escapeHtml(t.name)+'</span><span>'+onsetTagsHtml(t)+'</span></div>';
      }).join("");
      inner += '</div>';
    });
    if(!inner) inner = '<p class="small-muted">Ei osumia haulle.</p>';
    document.getElementById("theory-list-content").innerHTML = inner;
    $all(".topic-list-item").forEach(function(el){
      el.addEventListener("click", function(){ navigateTo("theory", {topicId: el.dataset.topic}); });
    });
  }
  draw("");
  document.getElementById("theory-search").addEventListener("input", function(e){ draw(e.target.value); });
}
function renderTheoryDetail(container, topicId){
  const t = byId(TOPICS, topicId);
  if(!t){ renderTheoryList(container); return; }
  let html = '<span class="back-link" id="theory-back">&larr; Takaisin listaan</span>';
  html += '<h2 class="view-title">'+escapeHtml(t.name)+'</h2>';
  html += '<div class="card">'+renderTopicCardFull(t)+'</div>';
  container.innerHTML = html;
  document.getElementById("theory-back").addEventListener("click", function(){ navigateTo("theory"); });
}

VIEW_RENDERERS.compare = function(container, params){
  let html = '<h2 class="view-title">'+COURSE.labels.compareTitle+'</h2><p class="view-lead">'+COURSE.labels.compareLead+'</p>';
  html += '<div class="card"><h3>Valmiit tentin kannalta keskeiset vertailuparit</h3><div id="cmp-pairs-list"></div></div>';
  html += '<div class="card"><h3>Rakenna oma vertailu</h3><p class="small-muted">Valitse 2–4 aihetta ja klikkaa Vertaa.</p>';
  html += '<div id="cmp-custom-checks" style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px"></div>';
  html += '<button class="btn" id="cmp-custom-btn">Vertaa valitut</button></div>';
  html += '<div id="cmp-result"></div>';
  container.innerHTML = html;

  const pairsListEl = document.getElementById("cmp-pairs-list");
  pairsListEl.innerHTML = COMPARISON_PAIRS.map(function(p){
    return '<div class="topic-list-item" data-cmp="'+p.id+'"><span class="name">'+escapeHtml(p.title)+'</span><span class="small-muted">'+p.topicIds.length+' aihetta</span></div>';
  }).join("");
  $all("[data-cmp]", pairsListEl).forEach(function(el){
    el.addEventListener("click", function(){ renderComparisonResult(byId(COMPARISON_PAIRS, el.dataset.cmp)); });
  });

  const checksEl = document.getElementById("cmp-custom-checks");
  checksEl.innerHTML = TOPICS.map(function(t){
    return '<label style="display:block;padding:3px 0;font-size:13px"><input type="checkbox" value="'+t.id+'" class="cmp-check"> '+escapeHtml(t.name)+'</label>';
  }).join("");
  document.getElementById("cmp-custom-btn").addEventListener("click", function(){
    const chosen = $all(".cmp-check", checksEl).filter(function(c){return c.checked;}).map(function(c){return c.value;});
    if(chosen.length<2 || chosen.length>4){ alert("Valitse 2–4 aihetta."); return; }
    renderComparisonResult(buildCustomComparison(chosen));
  });

  if(params && params.pairId){ renderComparisonResult(byId(COMPARISON_PAIRS, params.pairId)); }

  function buildCustomComparison(ids){
    const ts = ids.map(function(id){ return byId(TOPICS, id); });
    if(ts.every(function(t){ return t.sections; })){
      const titles = [];
      ts.forEach(function(t){ t.sections.forEach(function(sec){ if(sec.type!=="dev" && titles.indexOf(sec.title)<0) titles.push(sec.title); }); });
      return {
        id:"custom", title:"Oma vertailu: "+ts.map(function(t){return t.name;}).join(" vs. "),
        topicIds:ids,
        dimensions:titles.map(function(title){
          const values = {};
          ts.forEach(function(t){
            const sec = t.sections.find(function(x){ return x.title===title; });
            values[t.id] = !sec ? "–" : (sec.type==="list" ? sec.items.join(" • ") : sec.text);
          });
          return {label:title, values:values};
        }),
        note:"Oma koottu vertailu valituista aihekorteista."
      };
    }
    const dims = [
      {label:"Ydinmääritelmä", key:function(t){return t.core.definition;}},
      {label:"Keskeiset oireet", key:function(t){return fmtList(t.core.symptoms);}},
      {label:"Tyypillinen alkamisikä", key:function(t){return t.core.onset;}},
      {label:"Lapsuuden ilmeneminen", key:function(t){return t.development.childhood;}},
      {label:"Nuoruuden ilmeneminen", key:function(t){return t.development.adolescence;}},
      {label:"Aikuisuuden ilmeneminen", key:function(t){return t.development.adulthood;}},
      {label:"Erotusdiagnostiikka", key:function(t){return fmtList(t.core.differential);}},
      {label:"Tavalliset komorbiditeetit", key:function(t){return fmtList(t.core.comorbid);}},
      {label:"Kehityksellinen jatkuvuus", key:function(t){return t.development.continuity;}}
    ];
    return {
      id:"custom", title:"Oma vertailu: "+ts.map(function(t){return t.name;}).join(" vs. "),
      topicIds:ids,
      dimensions:dims.map(function(d){
        const values = {};
        ts.forEach(function(t){ values[t.id]=d.key(t); });
        return {label:d.label, values:values};
      }),
      note:"Oma koottu vertailu valituista aihekorteista."
    };
  }

  function renderComparisonResult(pair){
    if(!pair) return;
    const ts = pair.topicIds.map(function(id){ return byId(TOPICS, id); });
    let h = '<div class="card"><h3>'+escapeHtml(pair.title)+'</h3>';
    h += '<div style="overflow-x:auto"><table class="compare-table"><tr><th>Ulottuvuus</th>'+ts.map(function(t){return '<th>'+escapeHtml(t.name)+'</th>';}).join("")+'</tr>';
    pair.dimensions.forEach(function(dim){
      h += '<tr><td><strong>'+escapeHtml(dim.label)+'</strong></td>'+ts.map(function(t){ return '<td>'+fmtMarked(dim.values[t.id]||"–")+'</td>'; }).join("")+'</tr>';
    });
    h += '</table></div>';
    if(pair.note) h += '<p style="margin-top:12px"><strong>Tentin kannalta:</strong> '+fmtMarked(pair.note)+'</p>';
    h += '<div class="btn-row">'+ts.map(function(t){ return '<button class="btn secondary small" onclick="navigateTo(\'theory\',{topicId:\''+t.id+'\'})">Avaa: '+escapeHtml(t.name)+'</button>'; }).join("")+'</div>';
    h += '</div>';
    document.getElementById("cmp-result").innerHTML = h;
    document.getElementById("cmp-result").scrollIntoView({behavior:"smooth", block:"start"});
  }
};

function renderAnyItem(container, item, onAnswered){
  if(item.options){ renderMCQItem(container, item, onAnswered); }
  else if(item.statement!==undefined){ renderTFItem(container, item, onAnswered); }
  else if(item.vignette!==undefined){ renderCaseItem(container, item, onAnswered); }
  else if(item.rubric && item.maxPoints!==undefined){ renderEssayItem(container, item, onAnswered); }
  else if(item.modelAnswer){ renderShortItem(container, item, onAnswered); }
  else { container.innerHTML = '<p class="small-muted">Tuntematon kysymystyyppi.</p>'; onAnswered(0); }
}

function createQuizSession(container, items, itemRenderer, opts){
  opts = opts || {};
  let idx = 0;
  let sessionScore = 0, sessionMax = 0;
  const sessionCategoryTally = {};
  function tally(cat, frac){
    if(!sessionCategoryTally[cat]) sessionCategoryTally[cat] = {score:0, max:0};
    sessionCategoryTally[cat].score += frac;
    sessionCategoryTally[cat].max += 1;
    sessionScore += frac; sessionMax += 1;
    recordCategoryResult(cat, frac);
  }
  function showItem(){
    if(idx >= items.length){ showSummary(); return; }
    const item = items[idx];
    const wrap = document.createElement("div");
    const progress = document.createElement("div");
    progress.className = "q-progress";
    progress.textContent = "Tehtävä " + (idx+1) + " / " + items.length;
    wrap.appendChild(progress);
    const body = document.createElement("div");
    wrap.appendChild(body);
    container.innerHTML = "";
    container.appendChild(wrap);
    itemRenderer(body, item, function(frac){
      tally(item.category, frac);
      const nextBtn = document.createElement("button");
      nextBtn.className = "btn";
      nextBtn.style.marginTop = "14px";
      nextBtn.textContent = (idx === items.length-1) ? "Näytä yhteenveto" : "Seuraava tehtävä →";
      nextBtn.addEventListener("click", function(){ idx++; showItem(); });
      wrap.appendChild(nextBtn);
    });
  }
  function showSummary(){
    const overallPct = pct(sessionScore, sessionMax);
    let h = '<div class="card"><h3>Kierroksen yhteenveto</h3>';
    h += '<div style="font-size:24px;font-weight:700;color:var(--accent-dark)">'+Math.round(sessionScore*10)/10+' / '+sessionMax+' ('+overallPct+' %)</div>';
    h += '<div class="section-block" style="margin-top:12px"><h4>Tulokset aihealueittain tällä kierroksella</h4>';
    h += Object.keys(sessionCategoryTally).map(function(c){
      const s = sessionCategoryTally[c];
      const p = pct(s.score, s.max);
      const cls = p>=75?"good":(p>=50?"warn":"bad");
      return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+escapeHtml(topicCategoryName(c))+'</span><span>'+p+' %</span></div><div class="progress-bar-outer"><div class="progress-bar-inner '+cls+'" style="width:'+p+'%"></div></div></div>';
    }).join("");
    h += '</div><div class="btn-row"><button class="btn" id="qs-restart-btn">Uusi kierros (uudet tehtävät)</button></div></div>';
    container.innerHTML = h;
    container.querySelector("#qs-restart-btn").addEventListener("click", function(){
      if(opts.onRestart) opts.onRestart();
    });
  }
  showItem();
}

  ESSAY_BANK.forEach(function(it){ pool.push(it); });

  return pool;
}

VIEW_RENDERERS.weak = function(container){
  const accs = allCategoryAccuracies().filter(function(a){ return a.attempts>0; });
  let html = '<h2 class="view-title">Heikot alueet</h2><p class="view-lead">Perustuu tämän selaimen aiempiin vastauksiisi kaikissa harjoitustiloissa (tallennettu localStorageen).</p>';
  if(!accs.length){
    html += '<div class="card"><p class="small-muted">Ei vielä tarpeeksi dataa. Harjoittele ensin esim. Monivalinta- tai Satunnaisharjoittelu-tilassa, niin tämä näkymä alkaa tunnistaa heikoimmat aihealueesi.</p></div>';
    container.innerHTML = html;
    return;
  }
  const sorted = accs.slice().sort(function(a,b){ return a.accuracy-b.accuracy; });
  html += '<div class="card"><h3>Heikoimmat aihealueesi juuri nyt</h3>';
  html += sorted.slice(0,6).map(function(a){
    const p = Math.round(a.accuracy*100);
    const cls = p>=75?"good":(p>=50?"warn":"bad");
    return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+escapeHtml(a.name)+'</span><span>'+p+' % ('+a.attempts+' tehtävää)</span></div><div class="progress-bar-outer"><div class="progress-bar-inner '+cls+'" style="width:'+p+'%"></div></div></div>';
  }).join("");
  html += '<button class="btn" id="weak-start-btn" style="margin-top:10px">Harjoittele heikoimmat aiheet</button></div>';
  html += '<div id="weak-quiz-area"></div>';
  container.innerHTML = html;
  container.querySelector("#weak-start-btn").addEventListener("click", function(){
    const weakCount = Math.max(3, Math.ceil(sorted.length*0.4));
    const weakCatIds = sorted.slice(0, weakCount).map(function(a){ return a.id; });
    const pool = buildMixedPool().filter(function(it){ return weakCatIds.indexOf(it.category)>-1; });
    if(!pool.length){ alert("Ei vielä tarpeeksi tehtäviä näille aihealueille."); return; }
    const chosen = pickRandom(pool, Math.min(12, pool.length));
    createQuizSession(container.querySelector("#weak-quiz-area"), chosen, renderAnyItem, {
      onRestart: function(){ navigateTo("weak"); }
    });
  });
};

VIEW_RENDERERS.flashcards = function(container){ renderFlashcardUI(container, FLASHCARD_BANK.slice()); };
function renderFlashcardUI(container, queueSource){
  const queue = shuffle(queueSource);
  let i = 0;
  let flipped = false;
  function draw(){
    if(i >= queue.length){
      let h = '<h2 class="view-title">Flashcardit</h2><div class="card"><p>Kävit läpi kaikki '+queue.length+' korttia tällä kierroksella.</p>';
      h += '<div class="btn-row"><button class="btn" id="fc-restart">Aloita alusta (kaikki kortit)</button><button class="btn secondary" id="fc-hard">Kertaa vaikeat</button></div></div>';
      container.innerHTML = h;
      container.querySelector("#fc-restart").addEventListener("click", function(){ renderFlashcardUI(container, FLASHCARD_BANK.slice()); });
      container.querySelector("#fc-hard").addEventListener("click", function(){
        const hard = FLASHCARD_BANK.filter(function(c){ return STATE.flashcardStatus[c.id]==="ei" || STATE.flashcardStatus[c.id]==="osittain"; });
        renderFlashcardUI(container, hard.length ? hard : FLASHCARD_BANK.slice());
      });
      return;
    }
    const card = queue[i];
    let html = '<h2 class="view-title">Flashcardit</h2><p class="view-lead">Kortti '+(i+1)+' / '+queue.length+' &middot; '+escapeHtml(topicCategoryName(card.category))+' &middot; '+(card.difficulty==="vaativa"?"Vaativa":"Perus")+'</p>';
    html += '<div class="flashcard-wrap"><div class="flashcard" id="fc-card">'+escapeHtml(flipped ? card.back : card.front)+'</div></div>';
    html += '<p class="small-muted" style="text-align:center;margin-top:10px">Klikkaa korttia kääntääksesi '+(flipped?'takaisin kysymykseksi.':'vastaukseksi.')+'</p>';
    html += '<div class="btn-row" style="justify-content:center" id="fc-rate-row"></div>';
    container.innerHTML = html;
    container.querySelector("#fc-card").addEventListener("click", function(){ flipped = !flipped; draw(); });
    if(flipped){
      const row = container.querySelector("#fc-rate-row");
      row.innerHTML = '<button class="btn secondary small" data-r="osaan">Osasin</button><button class="btn secondary small" data-r="osittain">Osittain</button><button class="btn secondary small" data-r="ei">En osannut</button>';
      $all("[data-r]", row).forEach(function(b){
        b.addEventListener("click", function(){
          STATE.flashcardStatus[card.id] = b.dataset.r;
          const frac = b.dataset.r==="osaan" ? 1 : (b.dataset.r==="osittain" ? 0.5 : 0);
          recordCategoryResult(card.category, frac);
          saveState();
          i++; flipped = false; draw();
        });
      });
    }
  }
  draw();
}

function examKindLabel(kind){
  return {essay:"Essee", case:"Tapausanalyysi", mcq:"Monivalinta", tf:"Oikein/väärin", short:"Avoin kysymys"}[kind] || kind;
}
function buildExamItems(){
  const bp = EXAM_BLUEPRINT;
  if(bp.sections){
    const out = [];
    bp.sections.forEach(function(sec){
      const bank = {essay:ESSAY_BANK, "case":VIGNETTE_BANK, mcq:MCQ_BANK, tf:TF_BANK, short:SHORT_BANK}[sec.kind] || [];
      const pool = sec.filter ? bank.filter(function(it){
        return Object.keys(sec.filter).every(function(k){ return it[k]===sec.filter[k]; });
      }) : bank;
      pickRandom(pool, Math.min(sec.count, pool.length)).forEach(function(it){
        out.push({kind:sec.kind, item:it, weight:(sec.pts!=null ? sec.pts : it.maxPoints)});
      });
    });
    return out;
  }
  const essays = pickRandom(ESSAY_BANK, Math.min(bp.essayCount, ESSAY_BANK.length)).map(function(it){ return {kind:"essay", item:it, weight:it.maxPoints}; });
  const vignettes = pickRandom(VIGNETTE_BANK, Math.min(bp.vignetteCount, VIGNETTE_BANK.length)).map(function(it){ return {kind:"case", item:it, weight:it.maxPoints}; });
  const mcqs = pickRandom(MCQ_BANK, Math.min(bp.mcqCount, MCQ_BANK.length)).map(function(it){ return {kind:"mcq", item:it, weight:bp.mcqPts}; });
  const tfs = pickRandom(TF_BANK, Math.min(bp.tfCount, TF_BANK.length)).map(function(it){ return {kind:"tf", item:it, weight:bp.tfPts}; });
  const shorts = pickRandom(SHORT_BANK, Math.min(bp.shortCount, SHORT_BANK.length)).map(function(it){ return {kind:"short", item:it, weight:bp.shortPts}; });
  return [].concat(mcqs, tfs, shorts, vignettes, essays);
}
function startExam(container){
  const items = buildExamItems();
  let idx = 0;
  let totalEarned = 0, totalMax = 0;
  const byCategory = {};
  function tally(cat, frac, weight){
    const points = frac*weight;
    totalEarned += points; totalMax += weight;
    if(!byCategory[cat]) byCategory[cat] = {earned:0, max:0};
    byCategory[cat].earned += points; byCategory[cat].max += weight;
    recordCategoryResult(cat, frac);
  }
  function showItem(){
    if(idx >= items.length){ finish(); return; }
    const entry = items[idx];
    const wrap = document.createElement("div");
    const progress = document.createElement("div");
    progress.className = "q-progress";
    progress.textContent = "Tenttikysymys " + (idx+1) + " / " + items.length + " · osio: " + examKindLabel(entry.kind) + " · painoarvo " + entry.weight + " p";
    wrap.appendChild(progress);
    const body = document.createElement("div");
    wrap.appendChild(body);
    container.innerHTML = "";
    container.appendChild(wrap);
    renderAnyItem(body, entry.item, function(frac){
      tally(entry.item.category, frac, entry.weight);
      const nextBtn = document.createElement("button");
      nextBtn.className = "btn";
      nextBtn.style.marginTop = "14px";
      nextBtn.textContent = (idx === items.length-1) ? "Näytä tenttitulos" : "Seuraava kysymys →";
      nextBtn.addEventListener("click", function(){ idx++; showItem(); });
      wrap.appendChild(nextBtn);
    });
  }
  function finish(){
    const percentage = pct(totalEarned, totalMax);
    const passed = (EXAM_BLUEPRINT.passPct==null) ? null : percentage >= EXAM_BLUEPRINT.passPct;
    const catBreak = Object.keys(byCategory).map(function(c){
      return {id:c, name:topicCategoryName(c), pctv: pct(byCategory[c].earned, byCategory[c].max), earned:byCategory[c].earned, max:byCategory[c].max};
    }).sort(function(a,b){ return a.pctv-b.pctv; });
    const strong = catBreak.filter(function(c){ return c.pctv>=75; });
    const weakCats = catBreak.filter(function(c){ return c.pctv<60; });
    STATE.examHistory.push({date:new Date().toISOString ? new Date().toISOString().slice(0,10) : "", score:Math.round(totalEarned*10)/10, max:Math.round(totalMax*10)/10, pct:percentage, passed:passed, byCategory:catBreak});
    saveState();
    let h = '<div class="card"><h2 class="view-title" style="margin-top:0">Harjoitustentin tulos</h2>';
    h += '<div style="font-size:32px;font-weight:700;color:'+(passed===null?"var(--accent-dark)":(passed?"var(--good)":"var(--bad)"))+'">'+Math.round(totalEarned*10)/10+' / '+Math.round(totalMax*10)/10+' ('+percentage+' %)</div>';
    if(passed===null){ h += '<p style="font-size:14px">'+fmtMarked(EXAM_BLUEPRINT.resultNote||"")+'</p>'; }
    else { h += '<p style="font-size:16px"><strong>'+(passed?"Hyväksytty ✓":"Hylätty ✗")+'</strong> — hyväksymisraja on '+EXAM_BLUEPRINT.passPct+' %.</p>'; }
    h += '<div class="section-block"><h4>Pisteet aihealueittain</h4>';
    h += catBreak.map(function(c){
      const cls = c.pctv>=75?"good":(c.pctv>=50?"warn":"bad");
      return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>'+escapeHtml(c.name)+'</span><span>'+Math.round(c.earned*10)/10+' / '+Math.round(c.max*10)/10+' ('+c.pctv+' %)</span></div><div class="progress-bar-outer"><div class="progress-bar-inner '+cls+'" style="width:'+c.pctv+'%"></div></div></div>';
    }).join("");
    h += '</div>';
    h += '<div class="section-block"><h4>Vahvat osaamisalueet</h4>'+(strong.length ? ul(strong.map(function(c){ return c.name+" ("+c.pctv+" %)"; })) : '<p class="small-muted">Ei vielä selkeästi vahvoja alueita tässä tentissä.</p>')+'</div>';
    h += '<div class="section-block"><h4>Heikot osaamisalueet ja kertausehdotukset</h4>';
    if(weakCats.length){
      h += weakCats.map(function(c){
        const topicsInCat = TOPICS.filter(function(t){ return t.category===c.id; });
        return '<div style="margin-bottom:10px"><strong>'+escapeHtml(c.name)+'</strong> ('+c.pctv+' %) — kertaa: '+topicsInCat.slice(0,4).map(function(t){
          return '<span class="tag" style="cursor:pointer" onclick="navigateTo(\'theory\',{topicId:\''+t.id+'\'})">'+escapeHtml(t.name)+'</span>';
        }).join("")+'</div>';
      }).join("");
    } else {
      h += '<p class="small-muted">Ei selkeitä heikkoja alueita tässä tentissä.</p>';
    }
    h += '</div>';
    h += '<div class="btn-row"><button class="btn" id="exam-restart-btn">Aloita uusi harjoitustentti</button><button class="btn secondary" id="exam-stats-btn">Katso omat tilastot</button></div>';
    h += '</div>';
    container.innerHTML = h;
    container.querySelector("#exam-restart-btn").addEventListener("click", function(){ startExam(container); });
    container.querySelector("#exam-stats-btn").addEventListener("click", function(){ navigateTo("stats"); });
  }
  showItem();
}
VIEW_RENDERERS.exam = function(container){
  let html = '<h2 class="view-title">Harjoitustentti</h2><p class="view-lead">'+EXAM_BLUEPRINT.description+'</p>';
  if(STATE.examHistory.length){
    html += '<div class="card"><h3>Aiemmat suoritukset tässä selaimessa</h3>'+STATE.examHistory.slice(-3).reverse().map(function(e){
      const res = (e.passed===null||e.passed===undefined) ? "" : (" – "+(e.passed?"Hyväksytty":"Hylätty"));
      return '<div>'+escapeHtml(e.date)+': '+e.score+' / '+e.max+' ('+e.pct+' %)'+res+'</div>';
    }).join("")+'</div>';
  }
  html += '<div class="card"><button class="btn" id="exam-start-btn">Aloita uusi harjoitustentti</button></div>';
  html += '<div id="exam-area"></div>';
  container.innerHTML = html;
  container.querySelector("#exam-start-btn").addEventListener("click", function(){
    startExam(container.querySelector("#exam-area"));
  });
};

const COURSES = [MT_COURSE].concat(typeof PP2_COURSE !== "undefined" ? [PP2_COURSE] : []);
const DEFAULT_COURSE_ID = COURSES[COURSES.length-1].id;
const NAV_DEFAULTS = {};
$all(".nav-btn").forEach(function(b){
  NAV_DEFAULTS[b.dataset.view] = {icon:b.querySelector(".icon").textContent, label:b.textContent.replace(b.querySelector(".icon").textContent, "").trim()};
});

function applyCourseNav(c){
  $all(".nav-btn").forEach(function(b){
    const view = b.dataset.view;
    const conf = Object.assign({}, NAV_DEFAULTS[view], (c.nav||{})[view] || {});
    b.innerHTML = '<span class="icon">'+conf.icon+'</span>'+escapeHtml(conf.label);
    const bank = ["mcq","tf","short","essay","vignette","diagdrill","devchallenge"].indexOf(view)>-1 ? bankForMode(view) : null;
    const hidden = conf.hidden || (bank && bank.length===0) || (view==="compare" && !COMPARISON_PAIRS.length && !TOPICS.length) || (view==="lifecycle" && !LIFECYCLE_STAGES.length);
    b.style.display = hidden ? "none" : "";
  });
}
function renderCourseSwitch(){
  const el = document.getElementById("course-switch-list");
  el.innerHTML = COURSES.map(function(c){
    return '<button class="course-btn'+(COURSE && COURSE.id===c.id ? ' active' : '')+'" data-course="'+c.id+'">'+c.icon+' '+escapeHtml(c.switchLabel)+'<small>'+escapeHtml(c.switchSub)+'</small></button>';
  }).join("");
  $all(".course-btn", el).forEach(function(b){
    b.addEventListener("click", function(){ if(!COURSE || COURSE.id!==b.dataset.course) activateCourse(b.dataset.course); });
  });
}
function activateCourse(id, opts){
  const c = byId(COURSES, id) || COURSES[0];
  COURSE = c;
  const d = c.data;
  CATEGORIES = d.CATEGORIES; TOPICS = d.TOPICS; COMPARISON_PAIRS = d.COMPARISON_PAIRS; LIFECYCLE_STAGES = d.LIFECYCLE_STAGES;
  MCQ_BANK = d.MCQ_BANK; TF_BANK = d.TF_BANK; SHORT_BANK = d.SHORT_BANK; ESSAY_BANK = d.ESSAY_BANK; VIGNETTE_BANK = d.VIGNETTE_BANK;
  DIAGDRILL_BANK = d.DIAGDRILL_BANK; FLASHCARD_BANK = d.FLASHCARD_BANK; DEVCHALLENGE_BANK = d.DEVCHALLENGE_BANK;
  EXAM_BLUEPRINT = d.EXAM_BLUEPRINT; OVERVIEW_GROUPS = d.OVERVIEW_GROUPS;
  STORAGE_KEY = c.storageKey;
  STATE = loadState();
  try{ localStorage.setItem("suvi_active_course", c.id); }catch(e){ /* ei tallennusta */ }
  try{ if(location.hash !== "#kurssi="+c.id) history.replaceState(null, "", "#kurssi="+c.id); }catch(e){ /* esim. data:-osoite */ }
  document.getElementById("course-title").textContent = c.title;
  document.getElementById("course-subtitle").textContent = c.subtitle;
  document.title = c.title + " – tenttivalmennus";
  applyCourseNav(c);
  renderCourseSwitch();
  if(!(opts && opts.skipNavigate)) navigateTo("home");
}
function courseFromHash(){
  const m = /kurssi=([a-z0-9_-]+)/i.exec(location.hash || "");
  return m && byId(COURSES, m[1]) ? m[1] : null;
}
window.addEventListener("hashchange", function(){
  const id = courseFromHash();
  if(id && (!COURSE || COURSE.id!==id)) activateCourse(id);
});

/* =========================================================================
   INIT
   ========================================================================= */
(function initApp(){
  let savedCourse = null, savedTheme = null;
  try{ savedCourse = localStorage.getItem("suvi_active_course"); savedTheme = localStorage.getItem("suvi_theme"); }catch(e){ /* ei tallennusta */ }
  const startId = courseFromHash() || (savedCourse && byId(COURSES, savedCourse) ? savedCourse : DEFAULT_COURSE_ID);
  activateCourse(startId, {skipNavigate:true});
  document.documentElement.setAttribute("data-theme", savedTheme || STATE.theme || "light");
  navigateTo("home");
})();
